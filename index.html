<script>
  // Diagnostic: if something fails before React ever mounts (CDN blocked,
  // JS disabled by a preview/quick-look viewer, a script error, etc.), show
  // the actual error instead of leaving "Loading..." on screen forever.
  //
  // IMPORTANT: both checks below are gated on `!window.__mpMounted`, which
  // the app sets to true the moment it successfully renders once (see the
  // useEffect near the top of the MoviePicker component). Without that
  // guard, ANY unrelated error later in a normal session — while some
  // unrelated bit of UI happened to say "Loading" (e.g. "Loading more
  // details…", "Loading 3/20…") — would wipe the entire running app and
  // replace it with this plain error text, with no back button and no way
  // to recover except force-closing and reopening the file. That happened;
  // this guard is the fix. Post-mount errors are handled by the React
  // ErrorBoundary in the component itself instead, which has a real
  // recovery button.
  window.addEventListener('error', function (e) {
    if (window.__mpMounted) return;
    var root = document.getElementById('root');
    if (root && root.textContent.indexOf('Loading') !== -1) {
      root.innerHTML = '<div style="color:#f87171;padding:2rem;font-family:sans-serif;white-space:pre-wrap;">' +
        'Failed to load: ' + (e.message || e) + '</div>';
    }
  });
  setTimeout(function () {
    if (window.__mpMounted) return;
    var root = document.getElementById('root');
    if (root && root.textContent.indexOf('Loading') !== -1) {
      root.innerHTML = '<div style="color:#f87171;padding:2rem;font-family:sans-serif;">' +
        'Still stuck after 8s — a script (React/Babel/Tailwind CDN) likely failed to load. ' +
        'This can happen if the page was opened in a file preview instead of a real browser tab, ' +
        'or if there is no internet connection.</div>';
    }
  }, 8000);
</script>

// The original `window.storage` API only exists inside Claude.ai's own
// artifact sandbox. This file now runs standalone (e.g. in the Documents
// app's browser on your phone), so it's safe to back it with real
// localStorage instead — it persists on this device, tied to this exact
// file, across closes and reopens. (If you ever move/copy this file to a
// different location, the browser treats it as a new origin and your saved
// data won't follow — re-save it in place instead of duplicating it.)
window.storage = {
  get: async function (key) {
    var v = localStorage.getItem('moviepicker:' + key);
    return v !== null ? { value: v } : null;
  },
  set: async function (key, value) {
    localStorage.setItem('moviepicker:' + key, value);

};

// Merges FULL_* into whatever's currently saved, without duplicating
// or disturbing anything already customized. Runs automatically on load.
// `removed` is a persistent set of titles the user explicitly deleted —
// those are never re-added by the merge, even if still in the FULL_* lists.
const mergeLibrary = (love, radar, removed, randomPicks, disliked) => {
  const removedSet = new Set(removed.map(m => m.title.toLowerCase()));
  const dislikedSet = new Set((disliked || []).map(m => m.title.toLowerCase()));
  const excludeSet = new Set([...removedSet, ...dislikedSet]);
  const loveSet = new Set(FULL_LOVE.map(m => m.title.toLowerCase()));

  const cleanedRadar = radar.filter(m => !loveSet.has(m.title.toLowerCase()));

  const existingLove = new Set(love.map(m => m.title.toLowerCase()));
  const missingLove = FULL_LOVE.filter(
    m => !existingLove.has(m.title.toLowerCase()) && !excludeSet.has(m.title.toLowerCase())
  );
  const nextLove = [...love, ...missingLove];

  const everywhereForRadar = new Set([...nextLove, ...cleanedRadar].map(m => m.title.toLowerCase()));
  const existingRadar = new Set(cleanedRadar.map(m => m.title.toLowerCase()));
  const missingRadar = FULL_RADAR.filter(
    m => !everywhereForRadar.has(m.title.toLowerCase())
      && !existingRadar.has(m.title.toLowerCase())
      && !excludeSet.has(m.title.toLowerCase())
  );
  const nextRadar = [...cleanedRadar, ...missingRadar];

  // Random picks: dedupe against every other list plus removed/disliked, so a
  // pick never shows up twice or resurrects something already handled elsewhere.
  const cleanedRandom = (randomPicks || []).filter(m => !loveSet.has(m.title.toLowerCase()));
  const everywhereForRandom = new Set(
    [...nextLove, ...nextRadar, ...cleanedRandom].map(m => m.title.toLowerCase())
  );
  const missingRandom = FULL_RANDOM.filter(
    m => !everywhereForRandom.has(m.title.toLowerCase()) && !excludeSet.has(m.title.toLowerCase())
  );
  const nextRandom = [...cleanedRandom, ...missingRandom];

  return { nextLove, nextRadar, nextRandom };
};

// Bump this whenever the shape of `enriched` entries gains a new field that
// previously-cached titles need to go re-fetch to pick up (e.g. adding the
// `streaming` field after some titles were already cached without it).
// fetchEnrichment/preloadAllDetails treat any cached entry with an older (or
// missing) version as stale and will fetch it again, once, automatically.
const ENRICH_VERSION = 7; // 7: added fun facts (budget/revenue/collection/same-year), genre/rating auto-backfill, fetchedAt

// After this long, a cached title's poster/synopsis/cast/streaming/etc. is
// treated as stale and silently refetched the next time its page is opened
// (or during a "Preload all details" run) — mainly so streaming availability
// doesn't go stale forever. Doesn't affect `notFound` misses, which are
// gated separately in showDetail.
const ENRICH_STALE_MS = 21 * 24 * 60 * 60 * 1000; // 3 weeks

// Fallback TMDB key baked in so search/posters/enrichment work out of the
// box for anyone who opens this app (via the public GitHub Pages link)
// without having to get and paste their own key first. It's a free,
// non-billing TMDB key — fine to be visible in a public repo, worst case
// is shared rate-limiting, not financial exposure. Anyone (including you,
// on a new device) can still override it with their own key in Settings;
// a saved personal key always takes priority over this default.
const DEFAULT_TMDB_KEY = '9bec6a2de5654b18ff983e2e2a5d1fce';

function MoviePicker() {
  const [love, setLove] = useState([]);
  const [radar, setRadar] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [removed, setRemoved] = useState([]);
  const [disliked, setDisliked] = useState([]);
  const [randomPicks, setRandomPicks] = useState([]);
  const [activeTab, setActiveTab] = useState('radar');
  const [genreFilter, setGenreFilter] = useState('All');
  const [decadeFilter, setDecadeFilter] = useState('All');
  const [runtimeFilter, setRuntimeFilter] = useState('All');
  const [availabilityFilter, setAvailabilityFilter] = useState('All'); // 'All' | 'free' | 'rentbuy'
  const [ratingFilter, setRatingFilter] = useState('All'); // 'All' | '1'..'10' (star rating floor)
  const [matchFilter, setMatchFilter] = useState('All'); // 'All' | '1'..'10' (Match-o-Meter floor)
  const [sortMode, setSortMode] = useState('genre'); // 'genre' | 'rating'
  const [shareStatus, setShareStatus] = useState('');
  const [enriched, setEnriched] = useState({}); // title -> { extendedSynopsis, cast, similar, loading, error }
  const [preloadStatus, setPreloadStatus] = useState(null); // { done, total } | null
  const [pickHistory, setPickHistory] = useState([]);
  const [searchQuery, setSearchQuery] = useState('');
  // The one search bar: as you type, it looks up real TMDB matches (title +
  // year + poster, so you're picking the actual movie, not guessing at
  // spelling) and flags whether each one is already somewhere in your
  // library instead of silently letting you add a duplicate.
  const [tmdbResults, setTmdbResults] = useState([]);
  const [tmdbSearching, setTmdbSearching] = useState(false);
  const [tmdbKeyError, setTmdbKeyError] = useState(''); // distinguishes "TMDB rejected the key" from "genuinely 0 results"
  const searchDebounceRef = useRef(null);
  const [viewingMovie, setViewingMovie] = useState(null); // { ...movie, _tab, _label }
  const [error, setError] = useState('');
  const [retrying, setRetrying] = useState(false);
  const [saving, setSaving] = useState(false);
  const [justSaved, setJustSaved] = useState(false);
  const [confirmAction, setConfirmAction] = useState(null); // { message, onConfirm }
  const [debugSnapshot, setDebugSnapshot] = useState(null);
  const [debugSearch, setDebugSearch] = useState('');
  const [showSettings, setShowSettings] = useState(false);
  const [showPickActivity, setShowPickActivity] = useState(false);
  const [showBackToTop, setShowBackToTop] = useState(false);
  // Multi-select mode: lets you bulk-move/dislike/delete instead of tapping
  // into movies one at a time. Only meaningful on Love/Radar/Claude's Picks
  // — the actively-managed tabs — not Deleted/Disliked/Shuffled.
  const [selectMode, setSelectMode] = useState(false);
  const [selectedTitles, setSelectedTitles] = useState(() => new Set());

  // Back to top — shows up once you've scrolled a few screens down. Plain
  // window scroll (the app doesn't use an inner scroll container), so a
  // simple scroll listener is enough; passive for smooth scroll performance.
  useEffect(() => {
    const onScroll = () => setShowBackToTop(window.scrollY > 400);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  // Restores the saved list scroll position whenever the detail page closes
  // — covers the Back button and every action button that also closes it
  // (Move to Love, Dislike, Remove, etc.), since they all just clear
  // viewingMovie the same way. Runs after the list has re-rendered (next
  // frame), so it lands correctly even though the detail page you were just
  // on is usually much shorter than the list.
  useEffect(() => {
    if (viewingMovie === null) {
      const y = savedScrollRef.current;
      requestAnimationFrame(() => window.scrollTo({ top: y, behavior: 'auto' }));
    }
  }, [viewingMovie]);
  const [settingsTab, setSettingsTab] = useState('export');
  const [importText, setImportText] = useState('');
  const [importMsg, setImportMsg] = useState('');
  const [tmdbKey, setTmdbKey] = useState(DEFAULT_TMDB_KEY);
  const [hasCustomKey, setHasCustomKey] = useState(false); // true once a personal key overrides the baked-in default
  const [tmdbKeyInput, setTmdbKeyInput] = useState(''); // the Settings text field — kept separate so it doesn't show the shared default as if it were "yours"
  const [pickOptions, setPickOptions] = useState([]);
  const [fetchingFreshPicks, setFetchingFreshPicks] = useState(false);
  const [freshPicksMsg, setFreshPicksMsg] = useState('');
  const [undoToast, setUndoToast] = useState(null); // { title, message, fromDisliked }
  const undoTimerRef = useRef(null);
  // Where you were scrolled to on the list right before opening a movie's
  // detail page — restored on the way back out (Back button, or any action
  // that closes the detail view), instead of always landing back at the top.
  const savedScrollRef = useRef(0);
  // Swipe-gesture tracking on the detail page — declared up here (not next
  // to the handler functions below) because this component has an early
  // `if (!loaded) return ...` further down; a hook declared after that
  // point gets skipped on the first render and picked up on the next one,
  // which is an instant "Rendered more hooks than during the previous
  // render" crash. Every hook must live before that early return.
  const detailTouchRef = useRef(null);

  const showUndoToast = (title, message, fromDisliked) => {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setUndoToast({ title, message, fromDisliked });
    undoTimerRef.current = setTimeout(() => setUndoToast(null), 6000);
  };

  // Flags the outer HTML shell's pre-mount error watcher (see head of the
  // file) that React has successfully mounted at least once, so it stops
  // watching for "stuck on Loading" — it must never touch the DOM again
  // after this, or a single unrelated glitch later in the session could
  // wipe the whole app with no way back (see ErrorBoundary below for how
  // post-mount errors are actually meant to be handled).
  useEffect(() => { window.__mpMounted = true; }, []);

  // TMDB key lives in its own storage slot, separate from the main library
  // blob, since it changes independently and rarely. A personal key here
  // always overrides the baked-in DEFAULT_TMDB_KEY.
  useEffect(() => {
    (async () => {
      try {
        const stored = await window.storage.get('movies:tmdbKey', false);
        if (stored && stored.value) {
          setTmdbKey(stored.value);
          setTmdbKeyInput(stored.value);
          setHasCustomKey(true);
        }
      } catch {
        // no personal key saved — the baked-in default stays active
      }
    })();
  }, []);

  const saveTmdbKey = async (key) => {
    const trimmed = (key || '').trim();
    if (trimmed) {
      setTmdbKey(trimmed);
      setHasCustomKey(true);
      try { await window.storage.set('movies:tmdbKey', trimmed, false); } catch {
        // best-effort — key still works for this session even if save fails
      }
    } else {
      // Cleared the field and saved — fall back to the shared default again.
      setTmdbKey(DEFAULT_TMDB_KEY);
      setHasCustomKey(false);
      try { await window.storage.set('movies:tmdbKey', '', false); } catch {}
    }
  };

  // Log of what the quiet background Claude's Picks refresh has done —
  // { title, action: 'added' | 'removed', when } — so you can go check what
  // changed after a batch of edits instead of watching it happen live. Own
  // storage slot (like tmdbKey) so it never gets clobbered by an unrelated
  // persistAll call that doesn't know about it.
  const [pickActivity, setPickActivity] = useState([]);
  useEffect(() => {
    (async () => {
      try {
        const stored = await window.storage.get('movies:pickActivity', false);
        if (stored && stored.value) setPickActivity(JSON.parse(stored.value));
      } catch {
        // no log yet — fine, starts empty
      }
    })();
  }, []);

  const logPickActivity = async (entries) => {
    if (!entries.length) return;
    setPickActivity(prev => {
      const next = [...entries, ...prev].slice(0, 20);
      window.storage.set('movies:pickActivity', JSON.stringify(next), false).catch(() => {});
      return next;
    });
  };

  // "Continue browsing" — last few movie pages you opened, so you can jump
  // back in without re-searching. Own storage slot (like pickActivity) so
  // it never gets clobbered by an unrelated persistAll call. Only titles +
  // enough to reopen the page are stored, not full movie records.
  const [recentlyViewed, setRecentlyViewed] = useState([]);
  useEffect(() => {
    (async () => {
      try {
        const stored = await window.storage.get('movies:recentlyViewed', false);
        if (stored && stored.value) setRecentlyViewed(JSON.parse(stored.value));
      } catch {
        // no history yet — fine, starts empty
      }
    })();
  }, []);

  const logRecentlyViewed = (movie) => {
    if (!movie || !movie.title) return;
    const entry = { title: movie.title, year: movie.year || null, tab: movie._tab || null, label: movie._label || null, when: new Date().toISOString() };
    setRecentlyViewed(prev => {
      const next = [entry, ...prev.filter(e => e.title !== entry.title)].slice(0, 8);
      window.storage.set('movies:recentlyViewed', JSON.stringify(next), false).catch(() => {});
      return next;
    });
  };

  const openRecentlyViewed = (entry) => {
    const full = entry.tab ? allTagged.find(m => m.title === entry.title && m._tab === entry.tab) : null;
    showDetail(full || { title: entry.title, year: entry.year, _tab: entry.tab || undefined, _label: entry.label || undefined });
  };

  // How many pages deep the last Deep sweep got, per genre. TMDB's discover
  // endpoint is deterministic — "sort by popularity" returns the exact same
  // top results every time for the same filters. Without this, every sweep
  // re-scans pages 1-3 (the same ~60 most-popular titles per genre), finds
  // them all already tracked/deduped out, and looks "tapped out" even
  // though TMDB has far more movies than that. This lets each sweep start
  // deeper than the last one left off, instead of re-covering old ground.
  const [sweepPageOffset, setSweepPageOffset] = useState(0);
  useEffect(() => {
    (async () => {
      try {
        const stored = await window.storage.get('movies:sweepOffset', false);
        if (stored && stored.value) setSweepPageOffset(parseInt(stored.value, 10) || 0);
      } catch {
        // no offset yet — starts at page 1, same as before
      }
    })();
  }, []);

  useEffect(() => {
    (async () => {
      let baseLove = [], baseRadar = [], baseRemoved = [], baseRandom = [], baseDisliked = [], baseHistory = [], baseEnriched = {};
      let rawFound = false;
      let rawValueSnippet = '';
      try {
        // Preferred: single consolidated key
        const combined = await window.storage.get('movies:data', false);
        if (combined) {
          rawFound = true;
          rawValueSnippet = combined.value;
          const parsed = JSON.parse(combined.value);
          baseLove = normalize(parsed.love);
          baseRadar = normalize(parsed.radar);
          baseRemoved = normalizeRemoved(parsed.removed);
          baseRandom = normalize(parsed.randomPicks);
          baseDisliked = normalizeRemoved(parsed.disliked);
          baseHistory = Array.isArray(parsed.pickHistory) ? parsed.pickHistory : [];
          baseEnriched = (parsed.enriched && typeof parsed.enriched === 'object') ? parsed.enriched : {};
          // Fold any old separately-stored Convince Me data into Radar once, on migration
          if (parsed.convince && parsed.convince.length) {
            baseRadar = [...baseRadar, ...normalize(parsed.convince)];
          }
        } else {
          // Fallback: migrate from older per-list keys if present
          const l = await window.storage.get('movies:love', false);
          const r = await window.storage.get('movies:radar', false);
          const c = await window.storage.get('movies:convince', false);
          const rm = await window.storage.get('movies:removed', false);
          baseLove = l ? normalize(JSON.parse(l.value)) : [];
          baseRadar = r ? normalize(JSON.parse(r.value)) : [];
          if (c) baseRadar = [...baseRadar, ...normalize(JSON.parse(c.value))];
          baseRemoved = rm ? normalizeRemoved(JSON.parse(rm.value)) : [];
        }
      } catch {
        // start from empty if storage read fails; merge below still seeds everything
      }

      const { nextLove, nextRadar, nextRandom } = mergeLibrary(baseLove, baseRadar, baseRemoved, baseRandom, baseDisliked);

      setDebugSnapshot({
        loadedAt: new Date().toLocaleTimeString(),
        rawFound,
        rawValueSnippet: rawValueSnippet.slice(0, 300),
        rawLove: baseLove.map(m => m.title),
        rawRadar: baseRadar.map(m => m.title),
        mergedLove: nextLove.map(m => m.title),
        mergedRadar: nextRadar.map(m => m.title),
      });

      setLove(nextLove);
      setRadar(nextRadar);
      setRemoved(baseRemoved);
      setDisliked(baseDisliked);
      setRandomPicks(nextRandom);
      setPickHistory(baseHistory);
      setEnriched(baseEnriched);
      setLoaded(true);

      // Only write back if the merge actually changed something — avoids an
      // unnecessary save on every single load, and more importantly, routes
      // through the SAME serialized queue as every other save (persistAll)
      // instead of a separate direct write. Two independent, uncoordinated
      // writes to the same key is exactly what caused changes make right
      // after opening the app to occasionally get silently overwritten.
      const changed = JSON.stringify({ love: baseLove, radar: baseRadar, randomPicks: baseRandom })
        !== JSON.stringify({ love: nextLove, radar: nextRadar, randomPicks: nextRandom });
      if (changed) {
        persistAll({ love: nextLove, radar: nextRadar, removed: baseRemoved, randomPicks: nextRandom, disliked: baseDisliked, pickHistory: baseHistory });
      }
    })();
  }, []);

  // Queued save: coalesces rapid successive saves into one in-flight request
  // at a time (so quick actions never fire overlapping storage calls), and
  // retries with a real delay on failure instead of immediately re-hitting
  // whatever throttle just rejected the first attempt.
  const pendingSaveRef = useRef(null);
  const savingRef = useRef(false);
  const sleep = (ms) => new Promise(res => setTimeout(res, ms));

  const lastFailedRef = useRef(null);
  const enrichedRef = useRef({});
  useEffect(() => { enrichedRef.current = enriched; }, [enriched]);

  const runSaveLoop = useCallback(async () => {
    if (savingRef.current) return;
    savingRef.current = true;
    setSaving(true);
    setJustSaved(false);
    let anySucceeded = false;
    while (pendingSaveRef.current) {
      const next = pendingSaveRef.current;
      pendingSaveRef.current = null;
      const payload = JSON.stringify(next);
      let ok = false;
      for (let attempt = 0; attempt < 4 && !ok; attempt++) {
        if (attempt > 0) await sleep(500 * attempt); // 500ms, 1000ms, 1500ms
        try {
          await window.storage.set('movies:data', payload, false);
          await sleep(150); // allow any propagation lag before verifying
          const verify = await window.storage.get('movies:data', false);
          if (verify && verify.value === payload) {
            ok = true;
            anySucceeded = true;
            setError('');
            lastFailedRef.current = null;
          }
        } catch {
          // fall through to next attempt
        }
      }
      if (!ok) {
        lastFailedRef.current = next;
        setError('Save failed after retrying — your change is kept on screen but may not persist.');
      }
    }
    savingRef.current = false;
    setSaving(false);
    if (anySucceeded) {
      setJustSaved(true);
      setTimeout(() => setJustSaved(false), 2000);
    }
  }, []);

  const persistAll = useCallback((next) => {
    pendingSaveRef.current = { enriched: enrichedRef.current, ...next };
    return runSaveLoop();
  }, [runSaveLoop]);

  const retrySave = async () => {
    if (!lastFailedRef.current) return;
    setRetrying(true);
    await persistAll(lastFailedRef.current);
    setRetrying(false);
  };

  // Manual safety net since storage isn't reliably persisting in this
  // environment: export the entire current state as copyable text, and
  // import it back to restore exactly where you left off.
  const exportData = () => JSON.stringify({ love, radar, removed, randomPicks, disliked, pickHistory, enriched }, null, 2);

  const [copyStatus, setCopyStatus] = useState('');
  const copyToClipboard = async () => {
    const text = exportData();
    try {
      await navigator.clipboard.writeText(text);
      setCopyStatus('Copied! Paste it to Claude to save this as your new baseline.');
    } catch {
      setCopyStatus('Auto-copy blocked — opening Export panel, select-all manually instead.');
      setShowSettings(true);
      setSettingsTab('export');
    }
    setTimeout(() => setCopyStatus(''), 4000);
  };

  const importData = () => {
    try {
      const parsed = JSON.parse(importText);
      let nextLove = normalize(parsed.love);
      let nextRadar = normalize(parsed.radar);
      if (parsed.convince && parsed.convince.length) {
        nextRadar = [...nextRadar, ...normalize(parsed.convince)];
      }
      const nextRemoved = normalizeRemoved(parsed.removed);
      const nextRandom = normalize(parsed.randomPicks);
      const nextDisliked = normalizeRemoved(parsed.disliked);
      const nextHistory = Array.isArray(parsed.pickHistory) ? parsed.pickHistory : pickHistory;
      const nextEnriched = (parsed.enriched && typeof parsed.enriched === 'object') ? parsed.enriched : enriched;
      setLove(nextLove);
      setRadar(nextRadar);
      setRemoved(nextRemoved);
      setRandomPicks(nextRandom);
      setDisliked(nextDisliked);
      setPickHistory(nextHistory);
      setEnriched(nextEnriched);
      persistAll({ love: nextLove, radar: nextRadar, removed: nextRemoved, randomPicks: nextRandom, disliked: nextDisliked, pickHistory: nextHistory, enriched: nextEnriched });
      setImportMsg(`Imported: ${nextLove.length} Love, ${nextRadar.length} Radar, ${nextRandom.length} Claude's Picks`);
      setImportText('');
    } catch {
      setImportMsg('That text isn\u2019t valid — make sure you pasted the full export text.');
    }
  };

  // Where (if anywhere) a title already lives in the library — checked
  // case-insensitively across every list, not just Love/Radar, so the
  // search bar can also tell you "you already disliked/deleted this."
  const findExisting = (title) => {
    const norm = title.trim().toLowerCase();
    const has = (list) => list.some(m => m.title.trim().toLowerCase() === norm);
    if (has(love)) return { tab: 'love', label: 'Love' };
    if (has(radar)) return { tab: 'radar', label: 'Radar' };
    if (has(randomPicks)) return { tab: 'random', label: "Claude's Picks" };
    if (has(disliked)) return { tab: 'disliked', label: 'Disliked' };
    if (has(removed)) return { tab: 'removed', label: 'Deleted' };
    return null;
  };

  const addToList = (target, entry) => {
    if (target === 'love') {
      const nextLove = [...love, { ...entry, watchedDate: new Date().toISOString().slice(0, 10) }];
      setLove(nextLove);
      persistAll({ love: nextLove, radar, removed, randomPicks, disliked, pickHistory });
      fetchEnrichment(entry);
      refreshClaudesPicks(nextLove, radar, disliked, randomPicks);
    } else {
      const nextRadar = [...radar, entry];
      setRadar(nextRadar);
      persistAll({ love, radar: nextRadar, removed, randomPicks, disliked, pickHistory });
      fetchEnrichment(entry);
      refreshClaudesPicks(love, nextRadar, disliked, randomPicks);
    }
    setSearchQuery('');
    setTmdbResults([]);
  };

  // Adding from a real TMDB search result — the title/year come straight
  // from TMDB, so there's no risk of a misspelled duplicate.
  const addTmdbResult = (result, target) => addToList(target, { title: result.title, year: result.year, rating: null });

  // Fallback for movies TMDB search didn't surface (obscure titles, no key
  // set, etc.) — still runs through findExisting first so it can't create
  // a silent duplicate.
  const addManualTitle = (target) => {
    const title = searchQuery.trim();
    if (!title) return;
    addToList(target, { title, rating: null });
  };

  // Debounced TMDB search — fires ~400ms after typing stops, so it's not
  // hammering the API on every keystroke. Needs a TMDB key (Settings); with
  // no key, the search bar falls back to library-only search below.
  useEffect(() => {
    if (!tmdbKey || searchQuery.trim().length < 2) { setTmdbResults([]); setTmdbSearching(false); setTmdbKeyError(''); return; }
    if (searchDebounceRef.current) clearTimeout(searchDebounceRef.current);
    setTmdbSearching(true);
    searchDebounceRef.current = setTimeout(async () => {
      try {
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(tmdbKey)}&query=${encodeURIComponent(searchQuery.trim())}`;
        const res = await fetch(url);
        const data = await res.json();
        // TMDB responds 200 with { success: false, status_message } for a
        // bad/invalid key — fetch doesn't throw for that, so without this
        // check an invalid key looks identical to "genuinely 0 results."
        if (data && data.success === false) {
          setTmdbResults([]);
          setTmdbKeyError(data.status_message || 'TMDB rejected this key.');
        } else {
          setTmdbKeyError('');
          const results = ((data && data.results) || []).slice(0, 8).map(r => ({
            id: r.id,
            title: r.title,
            year: r.release_date ? parseInt(r.release_date.slice(0, 4), 10) : null,
            poster: r.poster_path ? `https://image.tmdb.org/t/p/w92${r.poster_path}` : null,
          }));
          setTmdbResults(results);
        }
      } catch (e) {
        setTmdbResults([]);
        setTmdbKeyError('Could not reach TMDB — check your connection.');
      } finally {
        setTmdbSearching(false);
      }
    }, 400);
    return () => { if (searchDebounceRef.current) clearTimeout(searchDebounceRef.current); };
  }, [searchQuery, tmdbKey]);

  const restoreMovie = (title, fromDisliked) => {
    const sourceList = fromDisliked ? disliked : removed;
    const item = sourceList.find(m => m.title === title);
    if (!item) return;
    const restored = { title: item.title, rating: item.rating, genre: item.genre, why: item.why };
    const target = item.source === 'love' ? 'love' : item.source === 'random' ? 'random' : 'radar';

    let nextLove = love, nextRadar = radar, nextRandom = randomPicks;
    if (target === 'love') nextLove = [...love, restored];
    else if (target === 'random') nextRandom = [...randomPicks, restored];
    else nextRadar = [...radar, restored];

    setLove(nextLove);
    setRadar(nextRadar);
    setRandomPicks(nextRandom);

    if (fromDisliked) {
      const nextDisliked = disliked.filter(m => m.title !== title);
      setDisliked(nextDisliked);
      persistAll({ love: nextLove, radar: nextRadar, removed, randomPicks: nextRandom, disliked: nextDisliked , pickHistory });
    } else {
      const nextRemoved = removed.filter(m => m.title !== title);
      setRemoved(nextRemoved);
      persistAll({ love: nextLove, radar: nextRadar, removed: nextRemoved, randomPicks: nextRandom, disliked , pickHistory });
    }
  };

  const removeMovie = (list, setList, key, title, sourceOverride) => {
    setConfirmAction({
      message: `Remove "${title}"? You can restore it later from the Deleted tab.`,
      onConfirm: () => {
        const item = list.find(m => m.title === title);
        const next = list.filter(m => m.title !== title);
        setList(next);

        const source = sourceOverride || (activeTab === 'love' ? 'love' : activeTab === 'random' ? 'random' : 'radar');
        const removedEntry = { title: (item || { title }).title, source, rating: item?.rating ?? null, genre: item?.genre ?? null, why: item?.why ?? null };
        const nextRemoved = [...removed, removedEntry];
        setRemoved(nextRemoved);

        const nextLove = source === 'love' ? next : love;
        const nextRadar = source === 'radar' ? next : radar;
        const nextRandom = source === 'random' ? next : randomPicks;
        persistAll({ love: nextLove, radar: nextRadar, removed: nextRemoved, randomPicks: nextRandom, disliked , pickHistory });
        showUndoToast(removedEntry.title, `Removed "${removedEntry.title}"`, false);
      },
    });
  };

  // Dislike is a distinct, explicit negative signal — separate from a plain
  // delete/cleanup. It removes the title from view (same as delete) but
  // tags it so the merge logic never resurfaces it, and so future batches
  // of suggestions I write into the code can steer away from that pattern.
  const dislikeMovie = (list, setList, title, sourceOverride) => {
    setConfirmAction({
      message: `Mark "${title}" as disliked? It won't be suggested again — you can undo from the Disliked tab.`,
      onConfirm: () => {
        const item = list.find(m => m.title === title);
        const next = list.filter(m => m.title !== title);
        setList(next);

        const source = sourceOverride || (activeTab === 'random' ? 'random' : 'radar');
        const dislikedEntry = { title: (item || { title }).title, source, rating: item?.rating ?? null, genre: item?.genre ?? null, why: item?.why ?? null };
        const nextDisliked = [...disliked, dislikedEntry];
        setDisliked(nextDisliked);

        const nextRadar = source === 'radar' ? next : radar;
        const nextRandom = source === 'random' ? next : randomPicks;
        persistAll({ love, radar: nextRadar, removed, randomPicks: nextRandom, disliked: nextDisliked , pickHistory });
        showUndoToast(dislikedEntry.title, `Marked "${dislikedEntry.title}" disliked`, true);
        refreshClaudesPicks(love, nextRadar, nextDisliked, nextRandom);
      },
    });
  };

  const promoteRandom = (title) => {
    const item = randomPicks.find(m => m.title === title);
    if (!item) return;
    const nextRandom = randomPicks.filter(m => m.title !== title);
    const nextRadar = [...radar, { ...item }];
    setRandomPicks(nextRandom);
    setRadar(nextRadar);
    persistAll({ love, radar: nextRadar, removed, randomPicks: nextRandom, disliked , pickHistory });
    refreshClaudesPicks(love, nextRadar, disliked, nextRandom);
  };

  const promoteToLove = (title) => {
    const item = radar.find(m => m.title === title);
    if (!item) return;
    const nextRadar = radar.filter(m => m.title !== title);
    const nextLove = [...love, { ...item, watchedDate: new Date().toISOString().slice(0, 10) }];
    setRadar(nextRadar);
    setLove(nextLove);
    persistAll({ love: nextLove, radar: nextRadar, removed, randomPicks, disliked , pickHistory });
    refreshClaudesPicks(nextLove, nextRadar, disliked, randomPicks);
  };

  // Straight from Claude's Picks to Love — for the ones you've already seen,
  // no need to route through Radar first.
  const promoteRandomToLove = (title) => {
    const item = randomPicks.find(m => m.title === title);
    if (!item) return;
    const nextRandom = randomPicks.filter(m => m.title !== title);
    const nextLove = [...love, { ...item, watchedDate: new Date().toISOString().slice(0, 10) }];
    setRandomPicks(nextRandom);
    setLove(nextLove);
    persistAll({ love: nextLove, radar, removed, randomPicks: nextRandom, disliked, pickHistory });
    refreshClaudesPicks(nextLove, radar, disliked, nextRandom);
  };

  // --- Multi-select bulk actions -----------------------------------------
  const toggleSelected = (title) => {
    setSelectedTitles(prev => {
      const next = new Set(prev);
      if (next.has(title)) next.delete(title); else next.add(title);
      return next;
    });
  };
  const exitSelectMode = () => { setSelectMode(false); setSelectedTitles(new Set()); };

  const bulkRemove = (list, setList, source) => {
    const titles = Array.from(selectedTitles);
    if (!titles.length) return;
    const label = source === 'love' ? 'Love' : source === 'radar' ? 'Radar' : "Claude's Picks";
    setConfirmAction({
      message: `Remove ${titles.length} movie${titles.length > 1 ? 's' : ''} from ${label}? You can restore them later from the Deleted tab.`,
      onConfirm: () => {
        const titleSet = new Set(titles);
        const items = list.filter(m => titleSet.has(m.title));
        const next = list.filter(m => !titleSet.has(m.title));
        setList(next);
        const nextRemoved = [...removed, ...items.map(item => ({ title: item.title, source, rating: item.rating ?? null, genre: item.genre ?? null, why: item.why ?? null }))];
        setRemoved(nextRemoved);
        const nextLove = source === 'love' ? next : love;
        const nextRadar = source === 'radar' ? next : radar;
        const nextRandom = source === 'random' ? next : randomPicks;
        persistAll({ love: nextLove, radar: nextRadar, removed: nextRemoved, randomPicks: nextRandom, disliked, pickHistory });
        exitSelectMode();
      },
    });
  };

  const bulkDislike = (list, setList, source) => {
    const titles = Array.from(selectedTitles);
    if (!titles.length) return;
    setConfirmAction({
      message: `Mark ${titles.length} movie${titles.length > 1 ? 's' : ''} as disliked? They won't be suggested again.`,
      onConfirm: () => {
        const titleSet = new Set(titles);
        const items = list.filter(m => titleSet.has(m.title));
        const next = list.filter(m => !titleSet.has(m.title));
        setList(next);
        const nextDisliked = [...disliked, ...items.map(item => ({ title: item.title, source, rating: item.rating ?? null, genre: item.genre ?? null, why: item.why ?? null }))];
        setDisliked(nextDisliked);
        const nextRadar = source === 'radar' ? next : radar;
        const nextRandom = source === 'random' ? next : randomPicks;
        persistAll({ love, radar: nextRadar, removed, randomPicks: nextRandom, disliked: nextDisliked, pickHistory });
        refreshClaudesPicks(love, nextRadar, nextDisliked, nextRandom);
        exitSelectMode();
      },
    });
  };

  const bulkPromoteToLove = () => {
    const titles = Array.from(selectedTitles);
    if (!titles.length) return;
    const titleSet = new Set(titles);
    const items = radar.filter(m => titleSet.has(m.title));
    const nextRadar = radar.filter(m => !titleSet.has(m.title));
    const nextLove = [...love, ...items.map(item => ({ ...item, watchedDate: new Date().toISOString().slice(0, 10) }))];
    setRadar(nextRadar);
    setLove(nextLove);
    persistAll({ love: nextLove, radar: nextRadar, removed, randomPicks, disliked, pickHistory });
    refreshClaudesPicks(nextLove, nextRadar, disliked, randomPicks);
    exitSelectMode();
  };

  const bulkPromoteRandom = () => {
    const titles = Array.from(selectedTitles);
    if (!titles.length) return;
    const titleSet = new Set(titles);
    const items = randomPicks.filter(m => titleSet.has(m.title));
    const nextRandom = randomPicks.filter(m => !titleSet.has(m.title));
    const nextRadar = [...radar, ...items.map(item => ({ ...item }))];
    setRandomPicks(nextRandom);
    setRadar(nextRadar);
    persistAll({ love, radar: nextRadar, removed, randomPicks: nextRandom, disliked, pickHistory });
    refreshClaudesPicks(love, nextRadar, disliked, nextRandom);
    exitSelectMode();
  };

  const bulkPromoteRandomToLove = () => {
    const titles = Array.from(selectedTitles);
    if (!titles.length) return;
    const titleSet = new Set(titles);
    const items = randomPicks.filter(m => titleSet.has(m.title));
    const nextRandom = randomPicks.filter(m => !titleSet.has(m.title));
    const nextLove = [...love, ...items.map(item => ({ ...item, watchedDate: new Date().toISOString().slice(0, 10) }))];
    setRandomPicks(nextRandom);
    setLove(nextLove);
    persistAll({ love: nextLove, radar, removed, randomPicks: nextRandom, disliked, pickHistory });
    refreshClaudesPicks(nextLove, radar, disliked, nextRandom);
    exitSelectMode();
  };

  const timeAgo = (iso) => {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.round(hrs / 24);
    return `${days}d ago`;
  };

  // Foreign-language badge — turns TMDB's ISO 639-1 code (from
  // enriched[title].originalLanguage) into a readable name. Uses the
  // browser's built-in Intl.DisplayNames when available, with a small
  // fallback map for common languages in case that API isn't supported.
  const LANGUAGE_NAME_FALLBACK = {
    es: 'Spanish', fr: 'French', ja: 'Japanese', ko: 'Korean', de: 'German',
    it: 'Italian', zh: 'Chinese', cn: 'Chinese', hi: 'Hindi', pt: 'Portuguese',
    ru: 'Russian', sv: 'Swedish', da: 'Danish', no: 'Norwegian', fi: 'Finnish',
    nl: 'Dutch', pl: 'Polish', tr: 'Turkish', ar: 'Arabic', th: 'Thai',
    he: 'Hebrew', cs: 'Czech', el: 'Greek', hu: 'Hungarian', ro: 'Romanian',
    id: 'Indonesian', vi: 'Vietnamese', uk: 'Ukrainian', fa: 'Persian',
  };
  const languageName = (code) => {
    if (!code || code === 'en') return null;
    try {
      const dn = new Intl.DisplayNames(['en'], { type: 'language' });
      const name = dn.of(code);
      if (name && name.toLowerCase() !== code.toLowerCase()) return name;
    } catch (e) { /* Intl.DisplayNames unsupported — fall through */ }
    return LANGUAGE_NAME_FALLBACK[code] || code.toUpperCase();
  };

  const getDecade = (m) => m.year ? `${Math.floor(m.year / 10) * 10}s` : null;
  const getMinutes = (m) => {
    if (!m.runtime) return null;
    const match = /(\d+)/.exec(m.runtime);
    return match ? parseInt(match[1], 10) : null;
  };
  // --- Genre consolidation --------------------------------------------
  // Your library's raw genre strings (and whatever TMDB throws in) map down
  // to 10 broad buckets for filtering, the taste profile, and TMDB genre
  // lookups. The original detailed genre string is untouched everywhere
  // else (title, director, stars, synopsis, why) — the "deeper knowledge"
  // that actually differentiates something like Indiana Jones (adventure,
  // 1980s, Harrison Ford, period piece) from a generic action movie comes
  // from those other signals in scoreCandidate below, not from having 20
  // overlapping genre labels to filter by.
  const BROAD_GENRE_MAP = {
    'action': 'Action', 'action-comedy': 'Action', 'superhero': 'Action', 'superhero-comedy': 'Action', 'western': 'Action',
    'adventure': 'Adventure', 'fantasy': 'Adventure',
    'comedy': 'Comedy', 'holiday comedy': 'Comedy', 'animation': 'Comedy', 'family': 'Comedy',
    'romance': 'Romance', 'rom-com': 'Romance',
    'drama': 'Drama', 'comedy-drama': 'Drama', 'music': 'Drama', 'documentary': 'Drama', 'tv movie': 'Drama',
    'crime': 'Crime', 'crime-comedy': 'Crime',
    'horror': 'Horror',
    'thriller': 'Thriller', 'mystery': 'Thriller',
    'sci-fi': 'Sci-Fi', 'sci-fi comedy': 'Sci-Fi', 'science fiction': 'Sci-Fi',
    'war': 'War & History', 'war-comedy': 'War & History', 'history': 'War & History',
  };
  const broadGenre = (raw) => (raw && BROAD_GENRE_MAP[raw.toLowerCase()]) || 'Other';

  const matchesDecade = (m) => decadeFilter === 'All' || getDecade(m) === decadeFilter;
  const matchesRuntime = (m) => {
    if (runtimeFilter === 'All') return true;
    const mins = getMinutes(m);
    if (mins == null) return false;
    if (runtimeFilter === 'under100') return mins < 100;
    if (runtimeFilter === '100to120') return mins >= 100 && mins < 120;
    if (runtimeFilter === '120to180') return mins >= 120 && mins < 180;
    if (runtimeFilter === 'over180') return mins >= 180;
    return true;
  };

  // "Is it free anywhere?" vs "would I have to pay per movie?" — reads off
  // whatever's already cached in `enriched[title].streaming` (populated by
  // opening a movie's page, or by "Preload all details" in Settings). A
  // title with no cached streaming data yet doesn't match either filter —
  // preload or open it once to get an answer.
  //
  // "Free" is hardcoded to the exact 8 subscriptions you actually pay for.
  // TMDB/JustWatch lists EVERY flatrate provider that carries a title —
  // fuboTV, Philo, Roku "channel" add-ons, MGM Plus, etc. — which are not
  // free to you just because they're technically a subscription somewhere.
  // Only a provider on this whitelist counts as free; everything else
  // (including TMDB's separate free/ad-supported tier — Tubi, Kanopy,
  // Hoopla — which isn't fetched at all) falls to rent/buy or "not
  // available free."
  const MY_STREAMING_SERVICES = [
    'netflix',
    'hulu',
    'disney plus', 'disney+',
    'max', 'hbo max',
    'paramount plus', 'paramount+',
    'peacock',
    'apple tv plus', 'apple tv+', 'apple tv',
    'amazon prime video', 'prime video',
  ];
  const isMyStreamingService = (name) => {
    if (!name) return false;
    const n = name.toLowerCase().trim();
    // Bundle/channel add-ons (e.g. "MGM Plus Roku Premium Channel") ride on
    // top of a base service but aren't included with it — exclude them even
    // though the name may contain a whitelisted word.
    if (n.includes('channel') || n.includes('roku premium')) return false;
    return MY_STREAMING_SERVICES.some((svc) => n === svc || n.startsWith(svc + ' '));
  };
  const myFreeProviders = (st) => (st && st.flatrate ? st.flatrate.filter(isMyStreamingService) : []);
  const matchesAvailability = (m) => {
    if (availabilityFilter === 'All') return true;
    const st = enriched[m.title] && enriched[m.title].streaming;
    if (!st) return false;
    const free = myFreeProviders(st).length > 0;
    const rentBuyOnly = !free && ((st.rent && st.rent.length) || (st.buy && st.buy.length));
    if (availabilityFilter === 'free') return free;
    if (availabilityFilter === 'rentbuy') return rentBuyOnly;
    return true;
  };

  // Star rating floor — a movie with no rating on file doesn't match a
  // specific floor (can't verify it), same convention as availability above.
  const matchesRating = (m) => {
    if (ratingFilter === 'All') return true;
    return m.rating != null && m.rating >= Number(ratingFilter);
  };

  // --- Taste profile & weighted picking --------------------------------
  // Built entirely from your own Love / Disliked lists — genre, director,
  // decade, and rating — so "Pick a movie" leans toward what you actually
  // watch. No network, no key needed.
  //
  // Deliberately excludes Removed: a plain delete just means "not tracking
  // this," not "I dislike this genre/director" — it shouldn't steer future
  // picks the way an explicit Dislike does.
  const decadeOfMovie = (m) => (m.year ? `${Math.floor(m.year / 10) * 10}s` : null);

  const buildTasteProfile = (loveList, dislikedList) => {
    const genreScore = {};
    const directorScore = {};
    const decadeScore = {};
    let ratingSum = 0, ratingCount = 0;
    const bump = (map, key, amount) => { if (key) map[key] = (map[key] || 0) + amount; };

    loveList.forEach(m => {
      bump(genreScore, broadGenre(m.genre), 2);
      bump(directorScore, m.director, 2);
      bump(decadeScore, decadeOfMovie(m), 1);
      if (m.rating != null) { ratingSum += m.rating; ratingCount++; }
    });
    dislikedList.forEach(m => {
      bump(genreScore, broadGenre(m.genre), -2);
      bump(directorScore, m.director, -2);
      bump(decadeScore, decadeOfMovie(m), -1);
    });

    return { genreScore, directorScore, decadeScore, preferredRating: ratingCount > 0 ? ratingSum / ratingCount : null };
  };

  const scoreCandidate = (m, profile) => {
    let score = 1; // baseline — nothing is ever fully excluded
    const bg = broadGenre(m.genre);
    if (profile.genreScore[bg]) score += profile.genreScore[bg];
    if (m.director && profile.directorScore[m.director]) score += profile.directorScore[m.director];
    const dec = decadeOfMovie(m);
    if (dec && profile.decadeScore[dec]) score += profile.decadeScore[dec] * 0.5;
    if (profile.preferredRating != null && m.rating != null) {
      score += Math.max(0, 1.5 - Math.abs(m.rating - profile.preferredRating) / 2);
    }
    return Math.max(score, 0.15); // small floor so low scorers can still surface sometimes
  };

  // "Name" / "Name as Character" -> just the name, for comparing cast lists
  // regardless of whether they came from your hand-typed `stars` field or
  // TMDB's enriched `cast` field.
  const parseNames = (str) => (str || '').split(',').map(s => s.split(' as ')[0].trim()).filter(Boolean);
  const castOf = (m) => (enriched[m.title]?.cast?.length ? parseNames(enriched[m.title].cast.join(', ')) : parseNames(m.stars));

  // Strips trailing sequel/prequel markers ("Chapter 2", ": Part One", "II",
  // a bare trailing number) to get a franchise's base title — a cheap
  // fallback for recognizing "this is obviously a sequel" when TMDB
  // collection data isn't cached yet (see collectionId below, which is the
  // reliable version of this same signal).
  const stripSequelSuffix = (title) => (title || '')
    .replace(/:?\s*(part|chapter)\s+(one|two|three|four|five|six|seven|eight|nine|ten|\d+)\s*$/i, '')
    .replace(/\s+\b(ii|iii|iv|v|vi|vii|viii|ix|x)\b\s*$/i, '')
    .replace(/\s+\d+\s*$/, '')
    .trim()
    .toLowerCase();

  // "Match-o-Meter" — a human-readable 1–10 read on how well a Radar /
  // Claude's Picks movie fits your taste, shown on its detail page and
  // thumbnails.
  //
  // This is a NEAREST-NEIGHBOR score, not a bucket average: it compares the
  // movie against every individual title in your Love list and explains
  // itself off the single best (and second-best) match, in priority order:
  //   1. Same franchise/collection (TMDB's own grouping, e.g. "The Bourne
  //      Collection") or an obvious title-pattern sequel/prequel — this is
  //      checked FIRST and explicitly, rather than as a side effect of
  //      "same director" like an earlier version did. That mattered because
  //      plenty of real sequels change directors (Bourne Identity ->
  //      Supremacy, most Fast & Furious entries...) — director-matching
  //      alone was silently missing those. And when it IS a sequel, this
  //      says so honestly ("same franchise as X") instead of dressing it up
  //      as a coincidental director match.
  //   2. Same director (a real but different signal from #1 — this is about
  //      directorial style, not franchise continuity).
  //   3. Shared cast, exact genre string, decade, rating closeness, TMDB
  //      genre-tag overlap.
  // Aggregate stats (e.g. "% of Love list that's Action") are still folded
  // in, but only as a small secondary contributor — capped low so they
  // can't flatten every same-genre movie into the same score/sentence like
  // before.
  //
  // Deliberately separate from scoreCandidate above: that one uses raw,
  // unbounded, library-size-dependent weights tuned for *sampling* (fine for
  // a weighted-random shuffle, meaningless shown to you as "14.2/10").
  const computeMatch = (movie) => {
    if (love.length === 0) return null; // nothing to compare against yet
    const bg = broadGenre(movie.genre);
    const dec = decadeOfMovie(movie);
    const movieCast = castOf(movie);
    const movieTmdbGenres = enriched[movie.title]?.tmdbGenres || [];
    const movieCollectionId = enriched[movie.title]?.collectionId || null;
    const movieBase = stripSequelSuffix(movie.title);
    const movieBaseIsSuffixed = movieBase !== movie.title.trim().toLowerCase() && movieBase.length > 2;

    const pairs = love.map(L => {
      let s = 0;
      const why = {};

      const lCollectionId = enriched[L.title]?.collectionId || null;
      if (movieCollectionId && lCollectionId && movieCollectionId === lCollectionId) {
        s += 6; why.collection = true;
      } else {
        // Fallback heuristic — only fires if at least one side actually had
        // a sequel marker stripped, so "Halloween" doesn't just coincidentally
        // match "Halloween II" less obviously than it should, but two
        // unrelated same-named movies don't falsely match either.
        const lBase = stripSequelSuffix(L.title);
        const lBaseIsSuffixed = lBase !== L.title.trim().toLowerCase() && lBase.length > 2;
        if (movieBase === lBase && (movieBaseIsSuffixed || lBaseIsSuffixed)) {
          s += 4; why.titleSequel = true;
        }
      }

      if (movie.director && L.director && movie.director === L.director) {
        s += 3; why.director = true;
      }
      if (movie.genre && L.genre && movie.genre.toLowerCase() === L.genre.toLowerCase()) {
        s += 2; why.exactGenre = true;
      } else if (broadGenre(L.genre) === bg) {
        s += 1; why.genre = true;
      }
      const sharedCast = movieCast.filter(n => castOf(L).includes(n));
      if (sharedCast.length) s += Math.min(3, sharedCast.length * 1.5);
      if (dec && decadeOfMovie(L) === dec) { s += 1; why.decade = true; }
      if (movie.rating != null && L.rating != null) {
        s += Math.max(0, 1 - Math.abs(movie.rating - L.rating) / 3);
      }
      const lTmdbGenres = enriched[L.title]?.tmdbGenres || [];
      if (movieTmdbGenres.length && lTmdbGenres.length) {
        const overlap = movieTmdbGenres.filter(g => lTmdbGenres.includes(g)).length;
        if (overlap) s += Math.min(1, overlap * 0.5);
      }
      return { L, s, why, sharedCast };
    }).sort((a, b) => b.s - a.s);

    const best = pairs[0];
    const second = pairs[1];

    // Smaller secondary contributor — still useful as a tiebreaker / for
    // when nothing specific stands out, but capped low so it can't drown
    // out the individual best-match signal above like it used to.
    const loveGenreShare = love.filter(m => broadGenre(m.genre) === bg).length / love.length;
    const dislikedGenreShare = disliked.length
      ? disliked.filter(m => broadGenre(m.genre) === bg).length / disliked.length
      : 0;
    const genreTrendPoints = Math.max(-2, Math.min(1.5, loveGenreShare * 3 - dislikedGenreShare * 4));
    const depthBonus = pairs.filter(p => p.s >= 3).length >= 3 ? 0.5 : 0; // several loved titles are all a decent fit

    const raw = 2 + Math.min(7, best.s * 0.8) + genreTrendPoints + depthBonus;
    const score = Math.max(1, Math.min(10, Math.round(raw)));

    const reasons = [];
    if (best.s >= 2) {
      let bit = null;
      if (best.why.collection) bit = `Same franchise as ${best.L.title} (${enriched[best.L.title]?.collectionName || enriched[movie.title]?.collectionName || 'same series'}), which you love.`;
      else if (best.why.titleSequel) bit = `Looks like a sequel or prequel to ${best.L.title}, which you love.`;
      else if (best.why.director) bit = `Same director as ${best.L.title}, which you love.`;
      else if (best.sharedCast.length) bit = `Shares ${best.sharedCast.slice(0, 2).join(' & ')} with ${best.L.title}, which you love.`;
      else if (best.why.exactGenre) bit = `Very close to ${best.L.title} — same genre, similar feel.`;
      else if (best.why.genre) bit = `Similar to ${best.L.title}, which you love.`;
      if (bit) reasons.push(bit);
      if (second && second.s >= 2.5 && second.L.title !== best.L.title) {
        reasons.push(`Also echoes ${second.L.title}.`);
      }
    }
    if (reasons.length < 2 && loveGenreShare >= 0.15) {
      reasons.push(`${bg} is a genre you watch a lot — ${Math.round(loveGenreShare * 100)}% of your Love list.`);
    } else if (reasons.length === 0 && dislikedGenreShare > loveGenreShare && dislikedGenreShare >= 0.15) {
      reasons.push(`${bg} skews toward movies you've disliked before.`);
    }
    if (reasons.length === 0) {
      reasons.push(genreTrendPoints < 0 ? 'Outside your usual genres.' : "Doesn't closely resemble anything specific in your Love list — a bit of a wildcard.");
    }

    return { score, reason: reasons.slice(0, 2).join(' ') };
  };

  // computeMatch is O(Love list size) per call (it compares the candidate
  // against every loved title). It used to be called fresh for every visible
  // row on every single render — with a few hundred movies in Radar/Claude's
  // Picks and a sizeable Love list, that added up to thousands of comparisons
  // per render and was the main cause of the app feeling slow as the library
  // grew. Cache the results and only recompute when the data a match score
  // actually depends on changes, instead of on every render.
  const matchCache = useMemo(() => {
    const cache = new Map();
    [...radar, ...randomPicks].forEach(m => cache.set(m.title, computeMatch(m)));
    return cache;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [radar, randomPicks, love, disliked, enriched]);
  const cachedMatch = (m) => (matchCache.has(m.title) ? matchCache.get(m.title) : computeMatch(m));

  // Match-o-Meter floor — same "can't verify, doesn't match" convention as
  // the other data-dependent filters (needs a Love list to score against).
  const matchesMatchFilter = (m) => {
    if (matchFilter === 'All') return true;
    const match = cachedMatch(m);
    return !!match && match.score >= Number(matchFilter);
  };

  // Runtime isn't always on the movie object itself (only the curated
  // library has a `.runtime` string) — fall back to whatever TMDB enrichment
  // has cached for titles added by hand or via search.
  const minsOf = (m) => getMinutes(m) ?? (enriched[m.title]?.tmdbRuntime || null);

  // All the numbers behind the Stats tab, computed once per relevant change
  // instead of on every render — same reasoning as matchCache above.
  const statsData = useMemo(() => {
    const genreCounts = {};
    love.forEach(m => { const g = broadGenre(m.genre); genreCounts[g] = (genreCounts[g] || 0) + 1; });
    const topGenres = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]);

    const decadeCounts = {};
    love.forEach(m => { const d = getDecade(m); if (d) decadeCounts[d] = (decadeCounts[d] || 0) + 1; });
    const topDecades = Object.entries(decadeCounts).sort((a, b) => a[0].localeCompare(b[0]));

    const directorCounts = {};
    love.forEach(m => { if (m.director) directorCounts[m.director] = (directorCounts[m.director] || 0) + 1; });
    const topDirectors = Object.entries(directorCounts).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]).slice(0, 5);

    const actorCounts = {};
    love.forEach(m => { castOf(m).forEach(name => { actorCounts[name] = (actorCounts[name] || 0) + 1; }); });
    const topActors = Object.entries(actorCounts).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]).slice(0, 5);

    const avgRating = (arr) => {
      const vals = arr.map(m => m.rating).filter(v => v != null);
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    };

    const runtimes = love.map(m => ({ title: m.title, mins: minsOf(m) })).filter(x => x.mins != null);
    const totalMinutes = runtimes.reduce((sum, x) => sum + x.mins, 0);
    const longest = runtimes.length ? [...runtimes].sort((a, b) => b.mins - a.mins)[0] : null;
    const shortest = runtimes.length ? [...runtimes].sort((a, b) => a.mins - b.mins)[0] : null;

    const years = love.map(m => m.year).filter(Boolean);

    return {
      topGenres,
      topDecades,
      topDirectors,
      topActors,
      avgLoveRating: avgRating(love),
      avgDislikedRating: avgRating(disliked),
      totalMinutes,
      longest,
      shortest,
      oldestYear: years.length ? Math.min(...years) : null,
      newestYear: years.length ? Math.max(...years) : null,
      foreignCount: love.filter(m => { const l = enriched[m.title]?.originalLanguage; return l && l !== 'en'; }).length,
      franchiseCount: love.filter(m => enriched[m.title]?.collectionId).length,
      radarFreeCount: radar.filter(m => { const st = enriched[m.title]?.streaming; return st && myFreeProviders(st).length > 0; }).length,
      radarKnownCount: radar.filter(m => enriched[m.title]?.streaming).length,
      totalShuffles: pickHistory.length,
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [love, radar, randomPicks, disliked, removed, enriched, pickHistory]);

  const weightedSample = (pool, weightFn, count) => {
    const remaining = pool.slice();
    const picked = [];
    while (remaining.length && picked.length < count) {
      const weights = remaining.map(weightFn);
      const total = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      let idx = 0;
      for (; idx < weights.length - 1; idx++) {
        r -= weights[idx];
        if (r <= 0) break;
      }
      picked.push(remaining[idx]);
      remaining.splice(idx, 1);
    }
    return picked;
  };

  // --- TMDB (optional, key-based) — fresh picks + posters ----------------
  // Keyed by the same 10 broad buckets as BROAD_GENRE_MAP above, so a
  // taste-profile genre score maps straight to TMDB's discover filters.
  const TMDB_GENRE_TO_IDS = {
    'Action': [28, 37], 'Adventure': [12, 14], 'Comedy': [35, 16, 10751],
    'Romance': [10749], 'Drama': [18, 10402, 99, 10770], 'Crime': [80],
    'Horror': [27], 'Thriller': [53, 9648], 'Sci-Fi': [878], 'War & History': [10752, 36],
  };
  // TMDB genre id -> broad bucket, for labeling fresh picks pulled from discover.
  const TMDB_ID_TO_BROAD_GENRE = {
    28: 'Action', 37: 'Action', 12: 'Adventure', 14: 'Adventure', 35: 'Comedy',
    16: 'Comedy', 10751: 'Comedy', 10749: 'Romance', 18: 'Drama', 10402: 'Drama',
    99: 'Drama', 10770: 'Drama', 80: 'Crime', 27: 'Horror', 53: 'Thriller',
    9648: 'Thriller', 878: 'Sci-Fi', 10752: 'War & History', 36: 'War & History',
  };

  const buildGenreIdList = (profile) => {
    const ids = new Set();
    Object.entries(profile.genreScore)
      .filter(([, v]) => v > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 4)
      .forEach(([genre]) => (TMDB_GENRE_TO_IDS[genre] || []).forEach(id => ids.add(id)));
    return Array.from(ids);
  };

  const fetchFreshPicks = async () => {
    if (!tmdbKey) {
      setFreshPicksMsg('Add a free TMDB API key in Settings first.');
      setTimeout(() => setFreshPicksMsg(''), 4000);
      return;
    }
    setFetchingFreshPicks(true);
    setFreshPicksMsg('');
    try {
      const profile = buildTasteProfile(love, disliked);
      const genreIds = buildGenreIdList(profile);
      const minRating = profile.preferredRating != null ? Math.max(5, Math.floor(profile.preferredRating) - 1) : 6;
      const existingTitles = new Set(
        [...love, ...radar, ...randomPicks, ...removed, ...disliked].map(m => m.title.toLowerCase())
      );
      const found = [];
      for (let page = 1; page <= 2 && found.length < 10; page++) {
        const url = `https://api.themoviedb.org/3/discover/movie?api_key=${encodeURIComponent(tmdbKey)}` +
          `&sort_by=popularity.desc&vote_average.gte=${minRating}&vote_count.gte=200` +
          (genreIds.length ? `&with_genres=${genreIds.join('|')}` : '') +
          `&page=${page}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('TMDB request failed (' + res.status + ')');
        const data = await res.json();
        for (const r of (data.results || [])) {
          if (found.length >= 10) break;
          if (!r.title || existingTitles.has(r.title.toLowerCase())) continue;
          existingTitles.add(r.title.toLowerCase());
          found.push({
            title: r.title,
            year: r.release_date ? parseInt(r.release_date.slice(0, 4), 10) : null,
            rating: r.vote_average != null ? Math.round(r.vote_average * 10) / 10 : null,
            ratingSource: 'TMDB',
            genre: (r.genre_ids && r.genre_ids.length) ? (TMDB_ID_TO_BROAD_GENRE[r.genre_ids[0]] || null) : null,
            synopsis: r.overview || null,
            why: 'Fresh pick based on your Love / Dislike taste profile',
            poster: r.poster_path ? `https://image.tmdb.org/t/p/w200${r.poster_path}` : null,
          });
        }
      }
      if (found.length === 0) {
        setFreshPicksMsg('No new matches right now — try again later.');
      } else {
        const nextRandom = [...randomPicks, ...found];
        setRandomPicks(nextRandom);
        persistAll({ love, radar, removed, randomPicks: nextRandom, disliked, pickHistory });
        setFreshPicksMsg(`Added ${found.length} fresh pick${found.length === 1 ? '' : 's'}!`);
      }
    } catch (err) {
      setFreshPicksMsg('Couldn’t reach TMDB — check your key and connection.');
    } finally {
      setFetchingFreshPicks(false);
      setTimeout(() => setFreshPicksMsg(''), 5000);
    }
  };

  // One-time deep sweep — "add whatever reasonably matches, dozens (or over
  // 100) is fine." Different from the two functions above: queries each of
  // your top loved genres SEPARATELY, several pages deep, instead of OR-ing
  // them into one query (which just returns whatever's globally popular and
  // drowns out your less-dominant genres). Looser rating/vote bar too, same
  // reasoning as refreshClaudesPicks. This is meant to run big — no cap on
  // how many it adds beyond what your genres/pages actually turn up.
  //
  // Advances sweepPageOffset each run (see its declaration above for why):
  // TMDB's popularity ranking is the same every time, so without moving the
  // page window, a second sweep re-fetches the same ~60 most-popular titles
  // per genre, finds them all already tracked, and looks like it found
  // nothing new — even though TMDB has far more than 3 pages per genre.
  const deepSweepPicks = async () => {
    if (!tmdbKey) {
      setFreshPicksMsg('Add a free TMDB API key in Settings first.');
      setTimeout(() => setFreshPicksMsg(''), 4000);
      return;
    }
    setFetchingFreshPicks(true);
    setFreshPicksMsg('Sweeping your whole library…');
    const PAGES_PER_RUN = 4;
    const startPage = sweepPageOffset + 1;
    try {
      const profile = buildTasteProfile(love, disliked);
      const topGenres = Object.entries(profile.genreScore)
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8)
        .map(([g]) => g);
      const genreIdLists = topGenres.map(g => TMDB_GENRE_TO_IDS[g] || []).filter(l => l.length);
      const minRating = profile.preferredRating != null ? Math.max(4, Math.floor(profile.preferredRating) - 2) : 5;
      const existingTitles = new Set(
        [...love, ...radar, ...randomPicks, ...removed, ...disliked].map(m => m.title.toLowerCase())
      );
      const found = [];
      for (const ids of genreIdLists) {
        for (let page = startPage; page < startPage + PAGES_PER_RUN; page++) {
          const url = `https://api.themoviedb.org/3/discover/movie?api_key=${encodeURIComponent(tmdbKey)}` +
            `&sort_by=popularity.desc&vote_average.gte=${minRating}&vote_count.gte=75` +
            `&with_genres=${ids.join('|')}&page=${page}`;
          let res;
          try { res = await fetch(url); } catch { continue; } // skip a bad page, don't abort the whole sweep
          if (!res.ok) continue;
          const data = await res.json();
          for (const r of (data.results || [])) {
            if (!r.title || existingTitles.has(r.title.toLowerCase())) continue;
            existingTitles.add(r.title.toLowerCase());
            found.push({
              title: r.title,
              year: r.release_date ? parseInt(r.release_date.slice(0, 4), 10) : null,
              rating: r.vote_average != null ? Math.round(r.vote_average * 10) / 10 : null,
              ratingSource: 'TMDB',
              genre: (r.genre_ids && r.genre_ids.length) ? (TMDB_ID_TO_BROAD_GENRE[r.genre_ids[0]] || null) : null,
              synopsis: r.overview || null,
              why: 'Deep sweep match based on your Love / Dislike taste profile',
              poster: r.poster_path ? `https://image.tmdb.org/t/p/w200${r.poster_path}` : null,
            });
          }
          await sleep(150); // gentle pacing rather than firing everything at once
        }
      }
      // Move the window forward for next time, wrapping back to the top
      // after ~32 pages deep per genre — past that, TMDB's own result
      // quality/relevance drops off regardless of genre, so a fresh
      // top-of-list pass (your dedup will skip anything already tracked)
      // is more useful than pushing even deeper.
      const nextOffset = (sweepPageOffset + PAGES_PER_RUN) % 32;
      setSweepPageOffset(nextOffset);
      window.storage.set('movies:sweepOffset', String(nextOffset), false).catch(() => {});
      if (found.length === 0) {
        setFreshPicksMsg('No new matches on this pass — try again, it digs deeper each time.');
      } else {
        const nextRandom = [...randomPicks, ...found];
        setRandomPicks(nextRandom);
        persistAll({ love, radar, removed, randomPicks: nextRandom, disliked, pickHistory });
        logPickActivity([{ title: `Deep sweep — ${found.length} added`, action: 'added', when: new Date().toISOString() }]);
        setFreshPicksMsg(`Added ${found.length} new picks!`);
      }
    } catch (err) {
      setFreshPicksMsg('Couldn’t reach TMDB — check your key and connection.');
    } finally {
      setFetchingFreshPicks(false);
      setTimeout(() => setFreshPicksMsg(''), 7000);
    }
  };

  // Keeps Claude's Picks quietly aligned with your taste as it evolves —
  // called after anything moves into Love, Radar, or Disliked (not Removed;
  // see buildTasteProfile's note on why). Drops a couple of existing picks
  // that clearly no longer fit and adds a couple that do, using the same
  // taste engine as Shuffle. Small batch on purpose — this runs often, not
  // just once. No-op without a TMDB key, and fails silently in the
  // background (it's a nicety, not a user-initiated action, so it never
  // pops an error message).
  const refreshClaudesPicks = async (nextLove, nextRadar, nextDisliked, nextRandom) => {
    if (!tmdbKey) return;
    const profile = buildTasteProfile(nextLove, nextDisliked);

    let trimmedRandom = nextRandom;
    let dropped = [];
    if (nextRandom.length > 6) {
      const scored = nextRandom.map(m => ({ m, s: scoreCandidate(m, profile) })).sort((a, b) => a.s - b.s);
      dropped = scored.filter(x => x.s < 0.4).slice(0, 2).map(x => x.m);
      const drop = new Set(dropped.map(m => m.title));
      if (drop.size) trimmedRandom = nextRandom.filter(m => !drop.has(m.title));
    }

    try {
      const genreIds = buildGenreIdList(profile);
      // Widened on purpose — this runs constantly in the background off a
      // single Love/Dislike, so it shouldn't demand a near-perfect match.
      // A somewhat-close fit that actually gets found beats a tight filter
      // that comes back empty most of the time.
      const minRating = profile.preferredRating != null ? Math.max(4, Math.floor(profile.preferredRating) - 2) : 5;
      const existingTitles = new Set(
        [...nextLove, ...nextRadar, ...trimmedRandom, ...removed, ...nextDisliked].map(m => m.title.toLowerCase())
      );
      const found = [];
      for (let page = 1; page <= 2 && found.length < 3; page++) {
        const url = `https://api.themoviedb.org/3/discover/movie?api_key=${encodeURIComponent(tmdbKey)}` +
          `&sort_by=popularity.desc&vote_average.gte=${minRating}&vote_count.gte=100` +
          (genreIds.length ? `&with_genres=${genreIds.join('|')}` : '') + `&page=${page}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('bad_status');
        const data = await res.json();
        for (const r of (data.results || [])) {
          if (found.length >= 3) break;
          if (!r.title || existingTitles.has(r.title.toLowerCase())) continue;
          existingTitles.add(r.title.toLowerCase());
          found.push({
            title: r.title,
            year: r.release_date ? parseInt(r.release_date.slice(0, 4), 10) : null,
            rating: r.vote_average != null ? Math.round(r.vote_average * 10) / 10 : null,
            ratingSource: 'TMDB',
            genre: (r.genre_ids && r.genre_ids.length) ? (TMDB_ID_TO_BROAD_GENRE[r.genre_ids[0]] || null) : null,
            synopsis: r.overview || null,
            why: 'Fresh pick based on your Love / Dislike taste profile',
            poster: r.poster_path ? `https://image.tmdb.org/t/p/w200${r.poster_path}` : null,
          });
        }
      }
      const finalRandom = [...trimmedRandom, ...found];
      setRandomPicks(finalRandom);
      persistAll({ love: nextLove, radar: nextRadar, removed, randomPicks: finalRandom, disliked: nextDisliked, pickHistory });
      const when = new Date().toISOString();
      logPickActivity([
        ...found.map(m => ({ title: m.title, action: 'added', when })),
        ...dropped.map(m => ({ title: m.title, action: 'removed', when })),
      ]);
    } catch {
      // TMDB unreachable — still apply the trim decided above so a bad
      // network moment doesn't block the "remove stale picks" half.
      if (trimmedRandom !== nextRandom) {
        setRandomPicks(trimmedRandom);
        persistAll({ love: nextLove, radar: nextRadar, removed, randomPicks: trimmedRandom, disliked: nextDisliked, pickHistory });
        logPickActivity(dropped.map(m => ({ title: m.title, action: 'removed', when: new Date().toISOString() })));
      }
    }
  };

  // Shuffle result (pickOptions) is now completely independent of the detail
  // page. Tapping a card just opens its movie page via showDetail — nothing
  // here clears pickOptions, so hitting Back brings you right back to the
  // same 1-3 cards instead of losing them and forcing a re-shuffle.
  const spin = () => {
    let pool = [];
    if (activeTab === 'radar') pool = radar;
    else if (activeTab === 'love') pool = love;
    else pool = randomPicks;
    if (genreFilter !== 'All') pool = pool.filter(m => broadGenre(m.genre) === genreFilter);
    pool = pool.filter(matchesDecade).filter(matchesRuntime).filter(matchesAvailability).filter(matchesRating).filter(matchesMatchFilter);
    if (pool.length === 0) { setPickOptions([]); return; }

    const profile = buildTasteProfile(love, disliked);
    const recentTitles = new Set(pickHistory.slice(0, 5).map(h => h.title));
    let candidatePool = pool.filter(m => !recentTitles.has(m.title));
    if (candidatePool.length === 0) candidatePool = pool; // everything's recent — allow repeats rather than stall

    const options = weightedSample(candidatePool, m => scoreCandidate(m, profile), Math.min(3, candidatePool.length));
    setPickOptions(options);

    // Log the whole batch once, here, rather than each time you tap into one
    // for details — logging on every detail-view visit would spam "Recently
    // Shuffled" with duplicates every time you went back and forth.
    const newEntries = options.map(o => ({ title: o.title, genre: o.genre, rating: o.rating, source: activeTab, when: new Date().toISOString() }));
    const newTitles = new Set(newEntries.map(e => e.title));
    const nextHistory = [...newEntries, ...pickHistory.filter(h => !newTitles.has(h.title))].slice(0, 15);
    setPickHistory(nextHistory);
    persistAll({ love, radar, removed, randomPicks, disliked, pickHistory: nextHistory });
  };

  if (!loaded) return <div className="p-8 text-slate-400">Loading...</div>;

  // Shared filter chain — used both for the visible list and for the
  // filtered/total counts shown on the tab buttons, so the two never drift.
  const applyFilters = (arr) => arr
    .filter(m => genreFilter === 'All' || broadGenre(m.genre) === genreFilter)
    .filter(matchesDecade)
    .filter(matchesRuntime)
    .filter(matchesAvailability)
    .filter(matchesRating)
    .filter(matchesMatchFilter);
  const filtersActive = genreFilter !== 'All' || decadeFilter !== 'All' || runtimeFilter !== 'All'
    || availabilityFilter !== 'All' || ratingFilter !== 'All' || matchFilter !== 'All';

  const list = applyFilters(activeTab === 'love' ? love : activeTab === 'radar' ? radar : activeTab === 'random' ? randomPicks : []);

  const availableDecades = Array.from(new Set(
    [...love, ...radar, ...randomPicks].map(getDecade).filter(Boolean)
  )).sort();

  const shareList = async () => {
    const lines = list
      .slice()
      .sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0))
      .map(m => `${m.title}${m.year ? ` (${m.year})` : ''}${m.rating != null ? ` — ★${m.rating}` : ''}`);
    const label = activeTab === 'love' ? 'Love' : activeTab === 'radar' ? 'Radar' : "Claude's Picks";
    const text = `${label}${genreFilter !== 'All' ? ` · ${genreFilter}` : ''}${decadeFilter !== 'All' ? ` · ${decadeFilter}` : ''}\n${lines.join('\n')}`;
    try {
      await navigator.clipboard.writeText(text);
      setShareStatus('Copied!');
    } catch {
      setShareStatus('Copy failed');
    }
    setTimeout(() => setShareStatus(''), 2000);
  };

  const toggleWatchedTogether = (title) => {
    const nextLove = love.map(m => m.title === title ? { ...m, watchedTogether: !m.watchedTogether } : m);
    setLove(nextLove);
    persistAll({ love: nextLove, radar, removed, randomPicks, disliked, pickHistory });
  };

  const allTagged = [
    ...love.map(m => ({ ...m, _tab: 'love', _label: 'Love' })),
    ...radar.map(m => ({ ...m, _tab: 'radar', _label: 'Radar' })),
    ...randomPicks.map(m => ({ ...m, _tab: 'random', _label: "Claude's Picks" })),
  ];
  const searchResults = searchQuery.trim()
    ? allTagged.filter(m => m.title.toLowerCase().includes(searchQuery.trim().toLowerCase())).slice(0, 20)
    : [];

  const showDetail = (movie) => {
    // Only capture when coming FROM the list (not detail-to-detail, e.g.
    // tapping into a "Similar to this" suggestion) — otherwise a nested
    // visit would overwrite the original spot with wherever the first
    // detail page happened to be scrolled to.
    if (!viewingMovie) savedScrollRef.current = window.scrollY;
    setViewingMovie(movie);
    setSearchQuery('');
    logRecentlyViewed(movie);
    // Poster + full synopsis + cast + similar movies all load automatically
    // here, from TMDB (needs the key from Settings) — no button, no
    // navigating away. Cached per-title afterward so reopening is instant.
    // Skip re-fetching titles TMDB already couldn't find after 2 tries —
    // "Try again" in the error state below still retries manually.
    if (!enriched[movie.title]?.notFound) {
      fetchEnrichment(movie);
    }
  };

  // Recent-history entries only store minimal fields; look up the full
  // record (synopsis/director/stars) from the live lists if it's still there.
  const showDetailFromHistory = (h) => {
    const tab = h.source === 'love' ? 'love' : h.source === 'random' ? 'random' : 'radar';
    const label = tab === 'love' ? 'Love' : tab === 'random' ? "Claude's Picks" : 'Radar';
    const full = allTagged.find(m => m.title === h.title && m._tab === tab);
    showDetail(full || { ...h, _tab: tab, _label: label });
  };

  const allTitlesSet = new Set([...love, ...radar, ...randomPicks].map(m => m.title));

  // Expanded movie-page details — poster, full synopsis, cast, tagline, and
  // similar-movies (with one-tap add to Radar). This used to call Claude
  // directly, which only works inside Claude.ai's own chat sandbox; it's
  // rebuilt on TMDB instead (same free key you already added in Settings
  // for posters/fresh picks), so it actually works standalone and loads
  // automatically the moment you open a movie's page — no button, no
  // separate URL, everything renders right here in the app.
  const buildFunFacts = (movie, d) => {
    const facts = [];
