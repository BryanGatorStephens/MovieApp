    if (d.budget > 0 && d.revenue > 0) {
      const ratio = d.revenue / d.budget;
      if (ratio >= 1.3) facts.push(`Made back ${ratio.toFixed(1)}x its budget at the box office ($${(d.budget / 1e6).toFixed(0)}M → $${(d.revenue / 1e6).toFixed(0)}M).`);
      else if (ratio < 0.8) facts.push(`Reportedly didn't recoup its budget at the box office ($${(d.budget / 1e6).toFixed(0)}M budget vs $${(d.revenue / 1e6).toFixed(0)}M gross).`);
    }
    if (d.belongs_to_collection) facts.push(`Part of ${d.belongs_to_collection.name}.`);
    if (d.vote_count >= 5000) facts.push(`Rated by over ${Math.round(d.vote_count / 1000).toLocaleString()}k people on TMDB.`);
    if (movie.year) {
      const sameYear = love.find(m => m.year === movie.year && m.title !== movie.title);
      if (sameYear) facts.push(`Same release year as "${sameYear.title}," which you love.`);
    }
    return facts.slice(0, 3);
  };

  const fetchEnrichment = async (movie, attempt = 0) => {
    if (!movie) return;
    // Cached and up to date — skip. If it was cached under an older
    // ENRICH_VERSION (e.g. before `streaming` existed), treat it as stale
    // and fall through to refetch it once, automatically.
    const cachedEntry = enriched[movie.title];
    const isStale = !!cachedEntry?.fetchedAt && (Date.now() - cachedEntry.fetchedAt) > ENRICH_STALE_MS;
    if ((cachedEntry?.cast || cachedEntry?.extendedSynopsis) && cachedEntry?.enrichedVersion === ENRICH_VERSION && !isStale) return;
    if (cachedEntry?.loading) return;
    if (!tmdbKey) {
      setEnriched(prev => ({ ...prev, [movie.title]: { ...(prev[movie.title] || {}), needsKey: true, loading: false, error: null } }));
      return;
    }
    setEnriched(prev => ({ ...prev, [movie.title]: { ...(prev[movie.title] || {}), loading: true, error: null, needsKey: false } }));
    try {
      const searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(tmdbKey)}` +
        `&query=${encodeURIComponent(movie.title)}` + (movie.year ? `&year=${movie.year}` : '');
      const searchRes = await fetch(searchUrl);
      if (!searchRes.ok) throw new Error('bad_status');
      const searchData = await searchRes.json();
      const match = (searchData.results || [])[0];
      if (!match) throw new Error('not_found');

      const detailUrl = `https://api.themoviedb.org/3/movie/${match.id}?api_key=${encodeURIComponent(tmdbKey)}&append_to_response=credits,similar,recommendations,watch/providers`;
      const detailRes = await fetch(detailUrl);
      if (!detailRes.ok) throw new Error('bad_status');
      const d = await detailRes.json();

      const poster = d.poster_path ? `https://image.tmdb.org/t/p/w342${d.poster_path}`
        : (match.poster_path ? `https://image.tmdb.org/t/p/w342${match.poster_path}` : null);
      const cast = ((d.credits && d.credits.cast) || [])
        .slice(0, 5)
        .map(c => (c.character ? `${c.name} as ${c.character}` : c.name));
      const dislikedSet = new Set(disliked.map(m => m.title.toLowerCase()));
      const removedSet = new Set(removed.map(m => m.title.toLowerCase()));
      // Blend TWO TMDB endpoints instead of just /similar: /similar is a
      // fairly mechanical genre/keyword match (thin pool, occasional odd
      // outliers — e.g. it once put a random boat drama under Anchorman);
      // /recommendations is behavior-based ("people who watched this also
      // watched...") and tends to read as more intuitive. Merging both,
      // deduped, roughly doubles the pool and dilutes any one algorithm's
      // weird picks instead of showing them 1-in-4.
      const seenTitles = new Set();
      const similar = [
        ...((d.recommendations && d.recommendations.results) || []).map(s => ({ ...s, _src: 'Recommended on TMDB' })),
        ...((d.similar && d.similar.results) || []).map(s => ({ ...s, _src: 'Similar on TMDB' })),
      ]
        .filter(s => {
          if (!s.title || s.title === movie.title) return false;
          const key = s.title.toLowerCase();
          if (seenTitles.has(key) || dislikedSet.has(key) || removedSet.has(key)) return false;
          seenTitles.add(key);
          return true;
        })
        .slice(0, 10)
        .map(s => ({
          title: s.title,
          year: s.release_date ? parseInt(s.release_date.slice(0, 4), 10) : null,
          reason: s._src,
        }));

      // US-only for now — TMDB's watch/providers data is region-specific and
      // this app doesn't have a region setting yet. Falls back to the
      // JustWatch search link (rendered elsewhere) when nothing comes back.
      const usProviders = d['watch/providers'] && d['watch/providers'].results && d['watch/providers'].results.US;
      // Deliberately NOT capturing TMDB's "free" / "ads" tiers (Tubi,
      // Kanopy, Hoopla, Pluto, etc.) — by request, those don't count as
      // "free" here and shouldn't show up at all. "Free" means flatrate:
      // included with a subscription you already pay for.
      const streaming = usProviders ? {
        flatrate: (usProviders.flatrate || []).map(p => p.provider_name),
        rent: (usProviders.rent || []).map(p => p.provider_name),
        buy: (usProviders.buy || []).map(p => p.provider_name),
      } : null;

      const next = {
        poster,
        extendedSynopsis: d.overview || null,
        cast,
        funFact: d.tagline || null,
        // Cheap, honest "fun facts" built entirely from fields this same
        // call already returns (no extra requests), plus a quick look at
        // your own Love list — real numbers, not invented trivia.
        funFacts: buildFunFacts(movie, d),
        similar,
        similarPage: 1,
        tmdbId: match.id,
        streaming,
        tmdbRuntime: d.runtime || null,
        tmdbGenres: (d.genres || []).map(g => g.name),
        tmdbRating: d.vote_average != null ? Math.round(d.vote_average * 10) / 10 : null,
        tmdbVoteCount: d.vote_count || null,
        // TMDB's own franchise/series grouping (e.g. "The Bourne Collection")
        // — null when the movie isn't part of one. Used by Match-o-Meter to
        // recognize an actual sequel/prequel even when the director changed
        // between entries (very common — Bourne, Fast & Furious, etc.).
        collectionId: d.belongs_to_collection ? d.belongs_to_collection.id : null,
        collectionName: d.belongs_to_collection ? d.belongs_to_collection.name : null,
        // ISO 639-1 code (e.g. "es", "ja") for the badge that flags
        // foreign-language films — null/"en" means nothing shows.
        originalLanguage: d.original_language || null,
        budget: d.budget || null,
        revenue: d.revenue || null,
        loading: false,
        error: null,
        needsKey: false,
        enrichedVersion: ENRICH_VERSION,
        // Powers the staleness check above — old cached entries (saved
        // before this existed) just get treated as due for a refresh once.
        fetchedAt: Date.now(),
      };

      // Auto-fill genre/rating for titles added by hand, from a bare TMDB
      // search result, or as a similar-movie suggestion — none of those
      // carry a genre/rating at add time. Never touches the 400+ curated
      // library entries, which already have both from a real editing pass.
      // Keeps the taste engine scoring these like everything else instead
      // of leaving them stuck in the "Other" genre bucket forever.
      const backfillMeta = (list) => {
        let changed = false;
        const out = list.map(m => {
          if (m.title.trim().toLowerCase() !== movie.title.trim().toLowerCase()) return m;
          const fill = {};
          if (!m.genre && next.tmdbGenres[0]) fill.genre = next.tmdbGenres[0];
          if (m.rating == null && next.tmdbRating != null) { fill.rating = next.tmdbRating; fill.ratingSource = 'TMDB'; }
          if (!Object.keys(fill).length) return m;
          changed = true;
          return { ...m, ...fill };
        });
        return changed ? out : list;
      };
      const patchedLove = backfillMeta(love);
      const patchedRadar = backfillMeta(radar);
      const patchedRandom = backfillMeta(randomPicks);
      if (patchedLove !== love) setLove(patchedLove);
      if (patchedRadar !== radar) setRadar(patchedRadar);
      if (patchedRandom !== randomPicks) setRandomPicks(patchedRandom);

      setEnriched(prev => {
        const merged = { ...prev, [movie.title]: { ...prev[movie.title], ...next } };
        persistAll({ love: patchedLove, radar: patchedRadar, removed, randomPicks: patchedRandom, disliked, pickHistory, enriched: merged });
        return merged;
      });
    } catch (err) {
      // Retry once for everything, including "not found" (a transient TMDB
      // hiccup can look identical to a real miss). Only after 2 tries do we
      // give up and cache it — `notFound` tells showDetail to stop
      // auto-retrying every time this movie's page is reopened; "Try again"
      // still works manually since it calls this function directly.
      if (attempt < 1) {
        await sleep(600);
        return fetchEnrichment(movie, attempt + 1);
      }
      const notFound = err.message === 'not_found';
      const msg = notFound ? "Couldn't find this movie on TMDB after a couple tries." : 'Couldn’t reach TMDB — check your key and connection.';
      setEnriched(prev => ({ ...prev, [movie.title]: { ...prev[movie.title], loading: false, error: msg, notFound } }));
    }
  };

  const addSimilarToRadar = (s) => {
    if (allTitlesSet.has(s.title)) return;
    const entry = { title: s.title, year: s.year || null, why: s.reason || 'Suggested as similar' };
    const nextRadar = [...radar, entry];
    setRadar(nextRadar);
    persistAll({ love, radar: nextRadar, removed, randomPicks, disliked, pickHistory });
    fetchEnrichment(entry);
    refreshClaudesPicks(love, nextRadar, disliked, randomPicks);
  };

  // Same quick-add pattern as Radar above, but for the other two calls you'd
  // make on a similar-movie suggestion: already seen it and loved it, or
  // know right away it's not for you. Both skip Radar entirely rather than
  // routing through it first.
  const addSimilarToLove = (s) => {
    if (allTitlesSet.has(s.title)) return;
    const entry = { title: s.title, year: s.year || null, why: s.reason || 'Suggested as similar', watchedDate: new Date().toISOString().slice(0, 10) };
    const nextLove = [...love, entry];
    setLove(nextLove);
    persistAll({ love: nextLove, radar, removed, randomPicks, disliked, pickHistory });
    fetchEnrichment(entry);
    refreshClaudesPicks(nextLove, radar, disliked, randomPicks);
  };

  const dislikeSimilarSuggestion = (s) => {
    if (allTitlesSet.has(s.title)) return;
    const entry = { title: s.title, source: 'preview', rating: null, genre: null, why: s.reason || null };
    const nextDisliked = [...disliked, entry];
    setDisliked(nextDisliked);
    persistAll({ love, radar, removed, randomPicks, disliked: nextDisliked, pickHistory });
    refreshClaudesPicks(love, radar, nextDisliked, randomPicks);
    showUndoToast(entry.title, `Marked "${entry.title}" disliked`, true);
  };

  // Fetches another page of TMDB's "similar" results for a movie whose page
  // is currently open, appending only genuinely new titles. Used both as a
  // manual "More like this" and automatically when every current suggestion
  // has been dismissed (disliked/removed) and nothing is left to show.
  const loadMoreSimilar = async (movie) => {
    if (!tmdbKey) return;
    const current = enriched[movie.title];
    if (!current || current.loadingMore) return;
    setEnriched(prev => ({ ...prev, [movie.title]: { ...prev[movie.title], loadingMore: true } }));
    try {
      let tmdbId = current.tmdbId;
      if (!tmdbId) {
        const searchUrl = `https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(tmdbKey)}` +
          `&query=${encodeURIComponent(movie.title)}` + (movie.year ? `&year=${movie.year}` : '');
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();
        const match = (searchData.results || [])[0];
        if (!match) throw new Error('not_found');
        tmdbId = match.id;
      }
      // Same blend as the initial fetch (see fetchEnrichment) — next page of
      // BOTH /similar and /recommendations, tracked with separate page
      // counters since the two endpoints paginate independently.
      const nextSimilarPage = (current.similarPage || 1) + 1;
      const nextRecPage = (current.recPage || 1) + 1;
      const [simRes, recRes] = await Promise.all([
        fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/similar?api_key=${encodeURIComponent(tmdbKey)}&page=${nextSimilarPage}`),
        fetch(`https://api.themoviedb.org/3/movie/${tmdbId}/recommendations?api_key=${encodeURIComponent(tmdbKey)}&page=${nextRecPage}`),
      ]);
      if (!simRes.ok && !recRes.ok) throw new Error('bad_status');
      const simData = simRes.ok ? await simRes.json() : { results: [] };
      const recData = recRes.ok ? await recRes.json() : { results: [] };
      const dislikedSet = new Set(disliked.map(m => m.title.toLowerCase()));
      const removedSet = new Set(removed.map(m => m.title.toLowerCase()));
      const existingTitles = new Set((current.similar || []).map(s => s.title.toLowerCase()));
      const fresh = [
        ...(recData.results || []).map(s => ({ ...s, _src: 'Recommended on TMDB' })),
        ...(simData.results || []).map(s => ({ ...s, _src: 'Similar on TMDB' })),
      ]
        .filter(s => {
          if (!s.title || s.title === movie.title) return false;
          const key = s.title.toLowerCase();
          if (existingTitles.has(key) || dislikedSet.has(key) || removedSet.has(key)) return false;
          existingTitles.add(key);
          return true;
        })
        .slice(0, 8)
        .map(s => ({ title: s.title, year: s.release_date ? parseInt(s.release_date.slice(0, 4), 10) : null, reason: s._src }));
      setEnriched(prev => {
        const merged = {
          ...prev,
          [movie.title]: { ...prev[movie.title], tmdbId, similar: [...(prev[movie.title].similar || []), ...fresh], similarPage: nextSimilarPage, recPage: nextRecPage, loadingMore: false },
        };
        persistAll({ love, radar, removed, randomPicks, disliked, pickHistory, enriched: merged });
        return merged;
      });
    } catch {
      setEnriched(prev => ({ ...prev, [movie.title]: { ...prev[movie.title], loadingMore: false } }));
    }
  };

  // Adding to Radar or dismissing straight from a similar-movie's own
  // preview page (opened by tapping into a "Similar to this" suggestion,
  // rather than a movie you already have tracked somewhere).
  const addPreviewToRadar = (movie) => {
    if (allTitlesSet.has(movie.title)) { setViewingMovie(null); return; }
    const entry = { title: movie.title, year: movie.year || null, why: movie.why || 'Suggested as similar' };
    const nextRadar = [...radar, entry];
    setRadar(nextRadar);
    persistAll({ love, radar: nextRadar, removed, randomPicks, disliked, pickHistory });
    refreshClaudesPicks(love, nextRadar, disliked, randomPicks);
    setViewingMovie(null);
  };

  const dismissPreview = (movie) => {
    setConfirmAction({
      message: `Don't suggest "${movie.title}" again? It won't show up as a similar-movie suggestion or in future picks.`,
      onConfirm: () => {
        const dislikedEntry = { title: movie.title, source: 'preview', rating: movie.rating ?? null, genre: movie.genre ?? null, why: movie.why ?? null };
        const nextDisliked = [...disliked, dislikedEntry];
        setDisliked(nextDisliked);
        persistAll({ love, radar, removed, randomPicks, disliked: nextDisliked, pickHistory });
        setViewingMovie(null);
      },
    });
  };

  // Swipe left/right on the detail page — the same actions as the buttons
  // further down, just reachable without hunting for them. Only wired for
  // Radar / Claude's Picks / an untracked preview, where there's an obvious
  // binary decision to make; a swipe on a Love page does nothing on purpose
  // (nothing left to decide there). Destructive swipes (left) still go
  // through removeMovie/dismissPreview, so the usual confirm + undo toast
  // still apply — swiping never skips that. (detailTouchRef itself is
  // declared near the top of the component, above the `if (!loaded)`
  // early return — see the comment there.)
  const handleDetailTouchStart = (e) => {
    const t = e.touches && e.touches[0];
    if (!t) return;
    detailTouchRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
  };
  const handleDetailSwipe = (direction) => {
    if (!viewingMovie) return;
    const tab = viewingMovie._tab;
    if (direction === 'right') {
      if (tab === 'radar') { promoteToLove(viewingMovie.title); setViewingMovie(null); }
      else if (tab === 'random') { promoteRandomToLove(viewingMovie.title); setViewingMovie(null); }
      else if (!tab) addPreviewToRadar(viewingMovie);
    } else if (direction === 'left') {
      if (tab === 'radar') { removeMovie(radar, setRadar, 'movies:radar', viewingMovie.title, 'radar'); setViewingMovie(null); }
      else if (tab === 'random') { removeMovie(randomPicks, setRandomPicks, null, viewingMovie.title, 'random'); setViewingMovie(null); }
      else if (!tab) dismissPreview(viewingMovie);
    }
  };
  const handleDetailTouchEnd = (e) => {
    const start = detailTouchRef.current;
    detailTouchRef.current = null;
    const t = e.changedTouches && e.changedTouches[0];
    if (!start || !t) return;
    const dx = t.clientX - start.x;
    const dy = t.clientY - start.y;
    const elapsed = Date.now() - start.time;
    // Deliberate, mostly-horizontal, reasonably quick swipe only — this is
    // what keeps a normal vertical scroll or a tap on Back from misfiring.
    if (elapsed < 800 && Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      handleDetailSwipe(dx > 0 ? 'right' : 'left');
    }
  };

  const preloadAllDetails = async () => {
    const all = [...love, ...radar, ...randomPicks];
    const seen = new Set();
    const todo = all.filter(m => {
      const cached = enriched[m.title];
      const isStale = !!cached?.fetchedAt && (Date.now() - cached.fetchedAt) > ENRICH_STALE_MS;
      const isFresh = cached?.cast && cached?.enrichedVersion === ENRICH_VERSION && !isStale;
      if (seen.has(m.title) || isFresh) return false;
      seen.add(m.title);
      return true;
    });
    setPreloadStatus({ done: 0, total: todo.length });
    for (let i = 0; i < todo.length; i++) {
      await fetchEnrichment(todo[i]);
      setPreloadStatus({ done: i + 1, total: todo.length });
      await sleep(400); // gentle pacing to avoid rate limits
    }
    setPreloadStatus(null);
  };

  return (
    <div className="min-h-screen bg-slate-900 text-slate-100 font-sans">
      <div className="max-w-md mx-auto px-5 py-8 pb-20">
        {viewingMovie ? (
          <div onTouchStart={handleDetailTouchStart} onTouchEnd={handleDetailTouchEnd}>
            {/* Sticky so Back is always reachable at a fixed spot while
                scrolling — Documents' own back button lives in the same
                top-left corner, and this keeps the two from getting mixed up. */}
            <div className="sticky top-0 z-30 -mx-5 px-5 py-3 mb-3 bg-slate-900/95 backdrop-blur-sm border-b border-slate-800">
              <button
                onClick={() => setViewingMovie(null)}
                className="flex items-center gap-1.5 text-sm text-slate-300 hover:text-white transition"
              >
                ← Back
              </button>
            </div>

            {(viewingMovie.poster || enriched[viewingMovie.title]?.poster) && (
              <img
                src={viewingMovie.poster || enriched[viewingMovie.title]?.poster}
                alt=""
                className="w-28 rounded-xl mb-4 border border-slate-700"
              />
            )}

            <h1 className="text-xl font-bold tracking-tight mb-1">{viewingMovie.title}</h1>
            <div className="flex items-center gap-2 flex-wrap mb-4">
              {viewingMovie._label && (
                <span className="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">{viewingMovie._label}</span>
              )}
              {viewingMovie.genre && (
                <span className="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">{viewingMovie.genre}</span>
              )}
              {viewingMovie.rating != null && (
                <span className="text-xs text-orange-500">★ {viewingMovie.rating} {viewingMovie.ratingSource || 'IMDb'}</span>
              )}
              {viewingMovie.runtime && (
                <span className="text-xs text-slate-400">{viewingMovie.runtime}</span>
              )}
              {(() => {
                const lang = languageName(enriched[viewingMovie.title]?.originalLanguage);
                return lang && <span className="text-xs bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded">🌐 {lang}</span>;
              })()}
            </div>

            {(viewingMovie.director || viewingMovie.stars) && (
              <div className="mb-4 text-sm text-slate-400 space-y-1">
                {viewingMovie.director && <p><span className="text-slate-500">Director:</span> {viewingMovie.director}</p>}
                {viewingMovie.stars && <p><span className="text-slate-500">Starring:</span> {viewingMovie.stars}</p>}
              </div>
            )}

            {viewingMovie.synopsis && (
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4">
                <p className="text-sm text-slate-300 leading-relaxed">{viewingMovie.synopsis}</p>
              </div>
            )}

            {viewingMovie.why && (
              <p className="text-sm text-slate-400 italic mb-4">💡 {viewingMovie.why}</p>
            )}

            {(viewingMovie._tab === 'radar' || viewingMovie._tab === 'random') && (() => {
              const match = cachedMatch(viewingMovie);
              if (!match) return null;
              const color = match.score >= 8 ? 'text-green-400' : match.score >= 5 ? 'text-orange-400' : 'text-red-400';
              return (
                <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4">
                  <div className="flex items-center justify-between mb-1.5">
                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide">🎯 Match-o-Meter</h3>
                    <span className={`text-lg font-bold ${color}`}>{match.score}/10</span>
                  </div>
                  <p className="text-xs text-slate-400">{match.reason}</p>
                  <p className="text-[10px] text-slate-600 mt-1">Based on your Love list — genre, director, decade, rating.</p>
                </div>
              );
            })()}

            {(() => {
              const se = enriched[viewingMovie.title];
              const st = se && se.streaming && (
                se.streaming.flatrate.length || se.streaming.rent.length || se.streaming.buy.length
              ) ? se.streaming : null;
              const freeProviders = st ? myFreeProviders(st) : [];
              // Flatrate providers TMDB lists that aren't on your 8 — these
              // don't count as free, but if they're the only "flatrate"
              // option surface it as effectively rent/buy-only rather than
              // silently vanishing.
              const otherProviders = st ? st.flatrate.filter((p) => !isMyStreamingService(p)) : [];
              return (
                <>
                  <div className="flex flex-wrap gap-2 mb-2">
                    {!st && (
                      <a
                        href={`https://www.justwatch.com/us/search?q=${encodeURIComponent(viewingMovie.title)}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-block text-sm font-medium text-orange-500 hover:text-orange-400 border border-orange-300 rounded-full px-4 py-1.5"
                      >
                        📺 Where to watch
                      </a>
                    )}
                    <a
                      href={`https://www.youtube.com/results?search_query=${encodeURIComponent(viewingMovie.title + (viewingMovie.year ? ` ${viewingMovie.year}` : '') + ' trailer')}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="inline-block text-sm font-medium text-blue-400 hover:text-blue-300 border border-blue-400/50 rounded-full px-4 py-1.5"
                    >
                      ▶️ Trailer
                    </a>
                  </div>
                  {st && (
                    <div className="mb-4 text-sm">
                      {freeProviders.length > 0 && <p className="text-green-400">🆓 Free (included with your subscriptions): <span className="font-medium">{freeProviders.join(', ')}</span></p>}
                      {st.rent.length > 0 && <p className="text-xs text-slate-400 mt-1">Rent: {st.rent.join(', ')}</p>}
                      {st.buy.length > 0 && <p className="text-xs text-slate-400 mt-0.5">Buy: {st.buy.join(', ')}</p>}
                      {freeProviders.length === 0 && otherProviders.length > 0 && (
                        <p className="text-xs text-slate-400 mt-1">Streaming on: {otherProviders.join(', ')} (not one of your subscriptions)</p>
                      )}
                      {freeProviders.length === 0 && (st.rent.length > 0 || st.buy.length > 0 || otherProviders.length > 0) && (
                        <p className="text-orange-400 text-xs mt-1">💰 Not free — you'd need to rent or buy it.</p>
                      )}
                      <p className="text-[10px] text-slate-600 mt-1">Streaming availability: JustWatch data via TMDB · US only. "Free" = on one of your 8 subscriptions (Netflix, Hulu, Disney+, Max, Paramount+, Peacock, Apple TV+, Prime Video) — other services it may stream on elsewhere don't count.</p>
                    </div>
                  )}
                </>
              );
            })()}
            {viewingMovie.watchedDate && (
              <p className="text-xs text-slate-500 -mt-4 mb-4">Watched {viewingMovie.watchedDate}</p>
            )}

            {/* Expanded details, loaded automatically from TMDB when the page opens */}
            {(() => {
              const e = enriched[viewingMovie.title];
              if (e?.needsKey) {
                return (
                  <p className="text-xs text-slate-500 mb-6">
                    Add a free TMDB API key in ⚙️ Settings below to see a full synopsis, cast, and similar movies here.
                  </p>
                );
              }
              if (!e || e.loading) {
                return <p className="text-sm text-slate-500 mb-6">Loading more details…</p>;
              }
              if (e.error) {
                return (
                  <div className="mb-6">
                    <p className="text-sm text-red-400 mb-2">{e.error}</p>
                    <button onClick={() => fetchEnrichment(viewingMovie)} className="text-xs text-blue-400 underline">Try again</button>
                  </div>
                );
              }
              return (
                <div className="mb-6 space-y-4">
                  {(e.tmdbRuntime || (e.tmdbGenres && e.tmdbGenres.length > 0) || e.tmdbRating != null) && (
                    <div className="flex flex-wrap gap-x-3 gap-y-1 text-xs text-slate-500">
                      {e.tmdbRuntime && <span>{e.tmdbRuntime} min</span>}
                      {e.tmdbGenres && e.tmdbGenres.length > 0 && <span>{e.tmdbGenres.join(', ')}</span>}
                      {e.tmdbRating != null && (
                        <span>★ {e.tmdbRating} TMDB{e.tmdbVoteCount ? ` (${e.tmdbVoteCount.toLocaleString()} votes)` : ''}</span>
                      )}
                    </div>
                  )}
                  {e.extendedSynopsis && (
                    <div>
                      <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Full Synopsis</h3>
                      <p className="text-sm text-slate-300 leading-relaxed">{e.extendedSynopsis}</p>
                    </div>
                  )}
                  {e.cast?.length > 0 && (
                    <div>
                      <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Cast</h3>
                      <ul className="text-sm text-slate-300 space-y-0.5">
                        {e.cast.map((c, i) => <li key={i}>{c}</li>)}
                      </ul>
                    </div>
                  )}
                  {(e.funFact || e.funFacts?.length > 0) && (
                    <div>
                      <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Did You Know</h3>
                      <ul className="text-sm text-slate-400 space-y-1">
                        {e.funFact && <li className="italic">🎬 "{e.funFact}"</li>}
                        {(e.funFacts || []).map((f, i) => <li key={i}>💡 {f}</li>)}
                      </ul>
                    </div>
                  )}
                  {e.similar?.length > 0 && (() => {
                    const dislikedSet = new Set(disliked.map(m => m.title.toLowerCase()));
                    const removedSet = new Set(removed.map(m => m.title.toLowerCase()));
                    // From a Love movie, the point is finding something NEW to
                    // watch — hide anything already tracked anywhere (Love,
                    // Radar, Claude's Picks) instead of just graying it out.
                    // From Radar / Claude's Picks / an untracked preview,
                    // already-tracked suggestions still show (disabled, with
                    // an "Already tracked" label) since those aren't
                    // discovery-mode pages.
                    const hideTracked = viewingMovie._tab === 'love';
                    const visible = e.similar.filter(s =>
                      !dislikedSet.has(s.title.toLowerCase()) &&
                      !removedSet.has(s.title.toLowerCase()) &&
                      !(hideTracked && allTitlesSet.has(s.title))
                    );
                    return (
                      <div>
                        <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Similar to this</h3>
                        {visible.length === 0 ? (
                          <div>
                            <p className="text-xs text-slate-500 mb-2">
                              {hideTracked ? "Nothing new here — you already have everything TMDB suggested." : "You've passed on all of these."}
                            </p>
                            <button onClick={() => loadMoreSimilar(viewingMovie)} disabled={e.loadingMore} className="text-xs text-blue-400 underline disabled:opacity-50">
                              {e.loadingMore ? 'Finding more…' : '🔄 Load a fresh batch'}
                            </button>
                          </div>
                        ) : (
                          <>
                            <div className="space-y-1.5">
                              {visible.map((s, i) => {
                                const already = allTitlesSet.has(s.title);
                                return (
                                  <div
                                    key={i}
                                    onClick={() => showDetail(allTagged.find(m => m.title === s.title) || { title: s.title, year: s.year, why: s.reason })}
                                    className="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 cursor-pointer hover:border-blue-500/60 transition"
                                  >
                                    <div className="flex items-center justify-between gap-2">
                                      <span className="text-sm font-medium">{s.title}{s.year && <span className="text-slate-500 font-normal"> ({s.year})</span>}</span>
                                      {already ? (
                                        <span className="text-xs shrink-0 text-slate-600">Already tracked</span>
                                      ) : (
                                        <div className="flex items-center gap-2 shrink-0">
                                          <button
                                            onClick={(ev) => { ev.stopPropagation(); addSimilarToRadar(s); }}
                                            className="text-xs text-blue-400 hover:text-blue-300"
                                          >
                                            + Radar
                                          </button>
                                          <button
                                            onClick={(ev) => { ev.stopPropagation(); addSimilarToLove(s); }}
                                            className="text-xs text-orange-500 hover:text-orange-400"
                                          >
                                            ❤️ Love
                                          </button>
                                          <button
                                            onClick={(ev) => { ev.stopPropagation(); dislikeSimilarSuggestion(s); }}
                                            className="text-xs text-slate-400 hover:text-red-400"
                                          >
                                            👎
                                          </button>
                                        </div>
                                      )}
                                    </div>
                                    {s.reason && <p className="text-xs text-slate-500 mt-0.5">{s.reason}</p>}
                                  </div>
                                );
                              })}
                            </div>
                            <button onClick={() => loadMoreSimilar(viewingMovie)} disabled={e.loadingMore} className="text-xs text-blue-400 underline mt-2 disabled:opacity-50">
                              {e.loadingMore ? 'Finding more…' : '🔄 More like this'}
                            </button>
                          </>
                        )}
                      </div>
                    );
                  })()}
                </div>
              );
            })()}

            {/* Context-appropriate actions based on which list this movie lives in */}
            <div className="flex gap-3 flex-wrap">
              {viewingMovie._tab === 'radar' && (
                <>
                  <button
                    onClick={() => { promoteToLove(viewingMovie.title); setViewingMovie(null); }}
                    className="text-sm text-orange-500 hover:text-orange-400 transition flex items-center gap-1.5"
                  >
                    <Heart size={14} /> Move to Love
                  </button>
                  <button
                    onClick={() => { dislikeMovie(radar, setRadar, viewingMovie.title, 'radar'); setViewingMovie(null); }}
                    className="text-sm text-slate-400 hover:text-red-400 transition"
                  >
                    👎 Dislike
                  </button>
                  <button
                    onClick={() => { removeMovie(radar, setRadar, 'movies:radar', viewingMovie.title, 'radar'); setViewingMovie(null); }}
                    className="text-sm text-slate-400 hover:text-slate-300 transition"
                  >
                    Remove
                  </button>
                </>
              )}
              {viewingMovie._tab === 'random' && (
                <>
                  <button
                    onClick={() => { promoteRandom(viewingMovie.title); setViewingMovie(null); }}
                    className="text-sm text-sky-400 hover:text-sky-400 transition"
                  >
                    + Add to Radar
                  </button>
                  <button
                    onClick={() => { promoteRandomToLove(viewingMovie.title); setViewingMovie(null); }}
                    className="text-sm text-orange-500 hover:text-orange-400 transition flex items-center gap-1.5"
                  >
                    <Heart size={14} /> Move to Love
                  </button>
                  <button
                    onClick={() => { dislikeMovie(randomPicks, setRandomPicks, viewingMovie.title, 'random'); setViewingMovie(null); }}
                    className="text-sm text-slate-400 hover:text-red-400 transition"
                  >
                    👎 Dislike
                  </button>
                  <button
                    onClick={() => { removeMovie(randomPicks, setRandomPicks, null, viewingMovie.title, 'random'); setViewingMovie(null); }}
                    className="text-sm text-slate-400 hover:text-slate-300 transition"
                  >
                    Remove
                  </button>
                </>
              )}
              {viewingMovie._tab === 'love' && (
                <button
                  onClick={() => { removeMovie(love, setLove, 'movies:love', viewingMovie.title, 'love'); setViewingMovie(null); }}
                  className="text-sm text-slate-400 hover:text-red-400 transition"
                >
                  Remove from Love
                </button>
              )}
              {/* Previewing a movie you don't have tracked anywhere yet —
                  reached by tapping into a "Similar to this" suggestion. */}
              {!viewingMovie._tab && (
                <>
                  <button
                    onClick={() => addPreviewToRadar(viewingMovie)}
                    className="text-sm text-sky-400 hover:text-sky-300 transition"
                  >
                    + Add to Radar
                  </button>
                  <button
                    onClick={() => dismissPreview(viewingMovie)}
                    className="text-sm text-slate-400 hover:text-red-400 transition"
                  >
                    🚫 Not interested
                  </button>
                </>
              )}
            </div>
          </div>
        ) : (
        <>
        <h1 className="text-2xl font-bold tracking-tight mb-1">Movie Night</h1>
        <p className="text-slate-400 text-sm mb-4">Pick something based on what you love.</p>

        {/* The one search bar — find a movie you already have, or look one
            up on TMDB and add it straight to Love/Radar. Every result says
            whether it's already somewhere in your library before you can
            add a duplicate. */}
        <div className="mb-4">
          <input
            value={searchQuery}
            onChange={e => setSearchQuery(e.target.value)}
            placeholder="🔍 Search any movie — find it or add it..."
            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm placeholder-slate-400 focus:outline-none focus:border-blue-500"
          />

          {searchQuery.trim() && (
            <div className="mt-2 space-y-1.5 max-h-96 overflow-y-auto">
              {!tmdbKey && (
                <>
                  <p className="text-[11px] text-slate-500 px-0.5">
                    Add a free TMDB key in ⚙️ Settings to search TMDB directly (with posters) and add new movies from here. For now this only searches what's already in your library.
                  </p>
                  {searchResults.length === 0 && (
                    <p className="text-slate-500 text-xs text-center py-3">No matches in your library.</p>
                  )}
                  {searchResults.map((m, i) => (
                    <button
                      key={m.title + i}
                      onClick={() => showDetail(m)}
                      className="w-full flex items-center justify-between bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-left hover:border-orange-400/60 transition"
                    >
                      <span className="text-sm">{m.title}</span>
                      <span className="flex items-center gap-2 text-xs text-slate-400 shrink-0 ml-2">
                        {m.rating != null && <span className="text-orange-500">★ {m.rating}</span>}
                        <span className="bg-slate-700 px-1.5 py-0.5 rounded">{m._label}</span>
                      </span>
                    </button>
                  ))}
                  {(() => {
                    const existing = findExisting(searchQuery);
                    return existing ? (
                      <p className="text-xs text-slate-500 text-center pt-1">Already in {existing.label}.</p>
                    ) : (
                      <div className="flex gap-2 justify-center pt-1">
                        <button onClick={() => addManualTitle('radar')} className="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded transition">+ Add "{searchQuery.trim()}" to Radar</button>
                        <button onClick={() => addManualTitle('love')} className="text-xs bg-orange-500 hover:bg-orange-400 text-white px-2.5 py-1.5 rounded transition">+ to Love</button>
                      </div>
                    );
                  })()}
                </>
              )}

              {tmdbKey && (
                <>
                  {tmdbSearching && <p className="text-slate-500 text-xs text-center py-3">Searching…</p>}
                  {!tmdbSearching && searchQuery.trim().length < 2 && (
                    <p className="text-slate-500 text-xs text-center py-3">Keep typing…</p>
                  )}
                  {!tmdbSearching && tmdbKeyError && (
                    <p className="text-red-400 text-xs text-center py-3">⚠️ {tmdbKeyError} Check the TMDB key in ⚙️ Settings.</p>
                  )}
                  {!tmdbSearching && !tmdbKeyError && searchQuery.trim().length >= 2 && tmdbResults.length === 0 && (
                    <p className="text-slate-500 text-xs text-center py-3">No TMDB matches.</p>
                  )}
                  {tmdbResults.map(r => {
                    const existing = findExisting(r.title);
                    const canOpen = existing && (existing.tab === 'love' || existing.tab === 'radar' || existing.tab === 'random');
                    return (
                      <div key={r.id} className="flex items-center gap-2.5 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-2">
                        {r.poster ? (
                          <img src={r.poster} alt="" className="w-8 h-12 object-cover rounded shrink-0 bg-slate-700" />
                        ) : (
                          <div className="w-8 h-12 bg-slate-700 rounded shrink-0" />
                        )}
                        <div
                          className={`flex-1 min-w-0 ${canOpen ? 'cursor-pointer' : ''}`}
                          onClick={() => {
                            if (!canOpen) return;
                            const full = allTagged.find(m => m.title.trim().toLowerCase() === r.title.trim().toLowerCase());
                            if (full) showDetail(full);
                          }}
                        >
                          <p className="text-sm truncate">{r.title}{r.year && <span className="text-slate-500"> ({r.year})</span>}</p>
                          <p className="text-xs text-slate-500">{existing ? `Already in ${existing.label}` : 'Not in your library yet'}</p>
                        </div>
                        {!existing && (
                          <div className="flex gap-1.5 shrink-0">
                            <button onClick={(e) => { e.stopPropagation(); addTmdbResult(r, 'radar'); }} className="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2 py-1.5 rounded transition">+ Radar</button>
                            <button onClick={(e) => { e.stopPropagation(); addTmdbResult(r, 'love'); }} className="text-xs bg-orange-500 hover:bg-orange-400 text-white px-2 py-1.5 rounded transition">+ Love</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {!tmdbSearching && searchQuery.trim().length >= 2 && !findExisting(searchQuery) && (
                    <div className="flex gap-2 justify-center items-center pt-1">
                      <span className="text-[11px] text-slate-500">Not it?</span>
                      <button onClick={() => addManualTitle('radar')} className="text-xs text-blue-400 underline underline-offset-2">Add "{searchQuery.trim()}" to Radar anyway</button>
                      <button onClick={() => addManualTitle('love')} className="text-xs text-orange-400 underline underline-offset-2">or Love</button>
                    </div>
                  )}
                </>
              )}
            </div>
          )}
        </div>

        {/* Continue browsing — last few movie pages you opened. Hidden while
            actively searching so it doesn't compete with search results. */}
        {!searchQuery.trim() && recentlyViewed.length > 0 && (
          <div className="mb-4">
            <h3 className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Continue Browsing</h3>
            <div className="flex gap-2 overflow-x-auto pb-1 -mx-5 px-5">
              {recentlyViewed.map((r, i) => (
                <button
                  key={r.title + i}
                  onClick={() => openRecentlyViewed(r)}
                  className="shrink-0 text-left bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 hover:border-blue-500/60 transition"
                >
                  <span className="block text-xs truncate max-w-[140px]">{r.title}</span>
                  {r.label && <span className="block text-[10px] text-slate-500 mt-0.5">{r.label}</span>}
                </button>
              ))}
            </div>
          </div>
        )}

        {(saving || justSaved) && (
          <div className={`fixed top-3 right-3 z-40 text-xs px-2.5 py-1 rounded-full font-medium transition ${
            saving ? 'bg-slate-700 text-slate-300' : 'bg-sky-400 text-white'
          }`}>
            {saving ? '● Saving…' : '✓ Saved'}
          </div>
        )}

        {/* Preload progress bar — pinned to the top so it's visible no matter
            which tab/screen you navigate to while it keeps running in the background. */}
        {preloadStatus && (
          <div className="fixed top-0 left-0 right-0 z-50 bg-slate-800 border-b border-slate-700 shadow-lg">
            <div
              className="h-1 bg-sky-400 transition-all duration-300"
              style={{ width: `${Math.min(100, Math.round((preloadStatus.done / Math.max(preloadStatus.total, 1)) * 100))}%` }}
            />
            <p className="text-center text-[11px] text-slate-300 py-1">
              ✨ Preloading details… {preloadStatus.done}/{preloadStatus.total}
            </p>
          </div>
        )}

        {undoToast && (
          <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-slate-100 text-slate-900 text-xs font-medium px-4 py-2.5 rounded-full shadow-lg">
            <span>{undoToast.message}</span>
            <button
              onClick={() => {
                restoreMovie(undoToast.title, undoToast.fromDisliked);
                setUndoToast(null);
                if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
              }}
              className="text-sky-600 font-semibold underline underline-offset-2"
            >
              Undo
            </button>
          </div>
        )}

        {selectMode && selectedTitles.size > 0 && (
          <div className="fixed bottom-0 left-0 right-0 z-50 bg-slate-800 border-t border-slate-700 shadow-lg px-4 py-3">
            <div className="max-w-lg mx-auto flex items-center gap-2 flex-wrap">
              <span className="text-xs font-medium text-slate-300 mr-1">{selectedTitles.size} selected</span>
              {activeTab === 'radar' && (
                <>
                  <button onClick={bulkPromoteToLove} className="text-xs bg-orange-500/20 text-orange-400 px-2.5 py-1.5 rounded-lg hover:bg-orange-500/30 transition">Move to Love</button>
                  <button onClick={() => bulkDislike(radar, setRadar, 'radar')} className="text-xs bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg hover:bg-slate-600 transition">👎 Dislike</button>
                  <button onClick={() => bulkRemove(radar, setRadar, 'radar')} className="text-xs bg-red-500/20 text-red-400 px-2.5 py-1.5 rounded-lg hover:bg-red-500/30 transition">Delete</button>
                </>
              )}
              {activeTab === 'love' && (
                <button onClick={() => bulkRemove(love, setLove, 'love')} className="text-xs bg-red-500/20 text-red-400 px-2.5 py-1.5 rounded-lg hover:bg-red-500/30 transition">Delete</button>
              )}
              {activeTab === 'random' && (
                <>
                  <button onClick={bulkPromoteRandom} className="text-xs bg-sky-500/20 text-sky-400 px-2.5 py-1.5 rounded-lg hover:bg-sky-500/30 transition">+ Add to Radar</button>
                  <button onClick={bulkPromoteRandomToLove} className="text-xs bg-orange-500/20 text-orange-400 px-2.5 py-1.5 rounded-lg hover:bg-orange-500/30 transition">Move to Love</button>
                  <button onClick={() => bulkDislike(randomPicks, setRandomPicks, 'random')} className="text-xs bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg hover:bg-slate-600 transition">👎 Dislike</button>
                  <button onClick={() => bulkRemove(randomPicks, setRandomPicks, 'random')} className="text-xs bg-red-500/20 text-red-400 px-2.5 py-1.5 rounded-lg hover:bg-red-500/30 transition">Remove</button>
                </>
              )}
              <button onClick={() => setSelectedTitles(new Set())} className="text-xs text-slate-400 hover:text-slate-300 ml-auto">Clear</button>
            </div>
          </div>
        )}

        {/* One unified tab bar — drives both the shuffle pool and the list below */}
        <div className="flex gap-2 mb-2">
          <button
            onClick={() => { setActiveTab('love'); setPickOptions([]); exitSelectMode(); }}
            className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-medium transition ${
              activeTab === 'love' ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-400'
            }`}
          >
            <Heart size={14} /> Love ({filtersActive ? `${applyFilters(love).length}/${love.length}` : love.length})
          </button>
          <button
            onClick={() => { setActiveTab('radar'); setPickOptions([]); exitSelectMode(); }}
            className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-medium transition ${
              activeTab === 'radar' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400'
            }`}
          >
            <Radar size={14} /> Radar ({filtersActive ? `${applyFilters(radar).length}/${radar.length}` : radar.length})
          </button>
          <button
            onClick={() => { setActiveTab('random'); setPickOptions([]); exitSelectMode(); }}
            className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-medium transition ${
              activeTab === 'random' ? 'bg-sky-400 text-white' : 'bg-slate-700 text-slate-400'
            }`}
          >
            🎲 Claude's Picks ({filtersActive ? `${applyFilters(randomPicks).length}/${randomPicks.length}` : randomPicks.length})
          </button>
        </div>
        <div className="flex gap-2 mb-4">
          <button
            onClick={() => { setActiveTab('deleted'); exitSelectMode(); }}
            className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-xs font-medium transition ${
              activeTab === 'deleted' ? 'bg-slate-100 text-slate-100' : 'bg-slate-800 text-slate-500 border border-slate-700'
            }`}
          >
            <Trash2 size={12} /> Deleted ({removed.length})
          </button>
          <button
            onClick={() => { setActiveTab('disliked'); exitSelectMode(); }}
            className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-xs font-medium transition ${
              activeTab === 'disliked' ? 'bg-slate-100 text-slate-100' : 'bg-slate-800 text-slate-500 border border-slate-700'
            }`}
          >
            👎 Disliked ({disliked.length})
          </button>
          <button
            onClick={() => { setActiveTab('shuffled'); exitSelectMode(); }}
            className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-xs font-medium transition ${
              activeTab === 'shuffled' ? 'bg-slate-100 text-slate-100' : 'bg-slate-800 text-slate-500 border border-slate-700'
            }`}
          >
            🕐 Shuffled ({pickHistory.length})
          </button>
          <button
            onClick={() => { setActiveTab('stats'); exitSelectMode(); }}
            className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 rounded-lg text-xs font-medium transition ${
              activeTab === 'stats' ? 'bg-slate-100 text-slate-100' : 'bg-slate-800 text-slate-500 border border-slate-700'
            }`}
          >
            📊 Stats
          </button>
        </div>

        {/* Recently auto-added/removed by the background Claude's Picks
            refresh — collapsed one-liner by default, only shown when there's
            actually something to report, so it's checkable after a batch of
            edits instead of interrupting you mid-edit. */}
        {activeTab === 'random' && pickActivity.length > 0 && (
          <div className="mb-3">
            <button
              onClick={() => setShowPickActivity(v => !v)}
              className="text-xs text-slate-400 hover:text-slate-300 transition flex items-center gap-1"
            >
              🔄 Recently auto-updated ({pickActivity.length}) {showPickActivity ? '▲' : '▼'}
            </button>
            {showPickActivity && (
              <div className="mt-1.5 space-y-1 max-h-40 overflow-y-auto">
                {pickActivity.map((a, i) => (
                  <div key={a.title + a.when + i} className="flex items-center justify-between text-xs bg-slate-900 border border-slate-700 rounded px-2 py-1">
                    <span className={a.action === 'added' ? 'text-green-400' : 'text-slate-500'}>
                      {a.action === 'added' ? '✨ ' : '🗑 '}{a.title}
                    </span>
                    <span className="text-slate-600 shrink-0 ml-2">{timeAgo(a.when)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Genre / decade / runtime / availability filters */}
        {activeTab !== 'stats' && (
        <div className="mb-2 grid grid-cols-2 gap-2">
          <select
            value={genreFilter}
            onChange={e => setGenreFilter(e.target.value)}
            className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500 appearance-none"
          >
            {['All', ...Array.from(new Set([...love, ...radar, ...randomPicks].map(m => broadGenre(m.genre)))).sort()].map(g => (
              <option key={g} value={g}>{g === 'All' ? 'All genres' : g}</option>
            ))}
          </select>
          <select
            value={decadeFilter}
            onChange={e => setDecadeFilter(e.target.value)}
            className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500 appearance-none"
          >
            <option value="All">All decades</option>
            {availableDecades.map(d => <option key={d} value={d}>{d}</option>)}
          </select>
          <select
            value={runtimeFilter}
            onChange={e => setRuntimeFilter(e.target.value)}
            className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500 appearance-none"
          >
            <option value="All">Any runtime</option>
            <option value="under100">⚡ Under 100 min</option>
            <option value="100to120">100–120 min</option>
            <option value="120to180">2–3 hrs</option>
            <option value="over180">3 hrs+</option>
          </select>
          <select
            value={availabilityFilter}
            onChange={e => setAvailabilityFilter(e.target.value)}
            className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500 appearance-none"
          >
            <option value="All">Any availability</option>
            <option value="free">🆓 Free / included</option>
            <option value="rentbuy">💰 Rent or buy only</option>
          </select>
          <select
            value={ratingFilter}
            onChange={e => setRatingFilter(e.target.value)}
            className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500 appearance-none"
          >
            <option value="All">Any star rating</option>
            {Array.from({ length: 10 }, (_, i) => 10 - i).map(n => (
              <option key={n} value={n}>★ {n}+</option>
            ))}
          </select>
          <select
            value={matchFilter}
            onChange={e => setMatchFilter(e.target.value)}
            className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500 appearance-none"
          >
            <option value="All">Any Match-o-Meter</option>
            {Array.from({ length: 10 }, (_, i) => 10 - i).map(n => (
              <option key={n} value={n}>🎯 {n}+</option>
            ))}
          </select>
        </div>
        )}

        {/* Sort + share row */}
        {activeTab !== 'stats' && (
        <div className="mb-4 flex items-center gap-2">
          <button
            onClick={() => setSortMode(sortMode === 'genre' ? 'rating' : 'genre')}
            className="flex items-center gap-1 text-xs bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-300 hover:border-blue-500 transition"
          >
            <ArrowUpDown size={12} /> {sortMode === 'genre' ? 'Sorted: A–Z' : 'Sorted: Top Rated'}
          </button>
          {activeTab !== 'deleted' && activeTab !== 'disliked' && activeTab !== 'shuffled' && (
            <button
              onClick={shareList}
              className="flex items-center gap-1 text-xs bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-300 hover:border-blue-500 transition"
            >
              <Share2 size={12} /> {shareStatus || 'Copy list'}
            </button>
          )}
          {activeTab === 'random' && (
            <button
              onClick={fetchFreshPicks}
              disabled={fetchingFreshPicks}
              className="flex items-center gap-1 text-xs bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-sky-300 hover:border-sky-400 transition disabled:opacity-50"
            >
              <Shuffle size={12} /> {fetchingFreshPicks ? 'Finding…' : (freshPicksMsg || 'Refresh picks')}
            </button>
          )}
          {activeTab === 'random' && (
            <button
              onClick={deepSweepPicks}
              disabled={fetchingFreshPicks}
              title="One-time thorough scan of your whole library — can add dozens or 100+ picks"
              className="flex items-center gap-1 text-xs bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-sky-300 hover:border-sky-400 transition disabled:opacity-50"
            >
              🔍 {fetchingFreshPicks ? '…' : 'Deep sweep'}
            </button>
          )}
          {['love', 'radar', 'random'].includes(activeTab) && (
            <button
              onClick={() => selectMode ? exitSelectMode() : setSelectMode(true)}
              className={`flex items-center gap-1 text-xs rounded-lg px-2 py-1.5 border transition ml-auto ${
                selectMode ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-blue-500'
              }`}
            >
              {selectMode ? 'Cancel' : '☑ Select'}
            </button>
          )}
          {selectMode && (
            <button
              onClick={() => setSelectedTitles(new Set(list.map(m => m.title)))}
              className="flex items-center gap-1 text-xs bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-300 hover:border-blue-500 transition"
            >
              Select all
            </button>
          )}
        </div>
        )}

        {/* Picker — result stays put across detail-page visits. Tapping a
            card opens its movie page; hitting Back brings you right back
            here instead of losing the batch and forcing a re-shuffle. */}
        {activeTab !== 'deleted' && activeTab !== 'disliked' && activeTab !== 'shuffled' && activeTab !== 'stats' && (
          <div className="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700">
            {pickOptions.length > 0 && (
              <div className="mb-3 space-y-2">
                <p className="text-xs text-slate-500 text-center">
                  {pickOptions.length > 1 ? 'Weighted toward your taste — tap one for details:' : 'Weighted toward your taste:'}
                </p>
                {pickOptions.map((opt, i) => {
                  // Movies added straight into a list (typed into the input
                  // box) only ever get {title, rating} — no synopsis/runtime/
                  // cast. Fall back to whatever TMDB enrichment has already
                  // cached for this title (fetchEnrichment runs on every add)
                  // so these cards look as complete as the seeded/fresh-pick
                  // ones instead of showing up sparse.
                  const e = enriched[opt.title];
                  const rating = opt.rating != null ? opt.rating : e?.tmdbRating;
                  const ratingSource = opt.rating != null ? (opt.ratingSource || 'IMDb') : 'TMDB';
                  const runtime = opt.runtime || (e?.tmdbRuntime ? `${e.tmdbRuntime} min` : null);
                  const synopsis = opt.synopsis || e?.extendedSynopsis;
                  const stars = opt.stars || (e?.cast && e.cast.length ? e.cast.slice(0, 3).join(', ') : null);
                  return (
                    <div
                      key={opt.title + i}
                      onClick={() => showDetail({ ...opt, _tab: activeTab, _label: activeTab === 'love' ? 'Love' : activeTab === 'radar' ? 'Radar' : "Claude's Picks" })}
                      className="bg-slate-900 border border-slate-700 hover:border-blue-500/60 rounded-xl px-3 py-2.5 cursor-pointer transition"
                    >
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-sm font-semibold">{opt.title}{opt.year && <span className="text-slate-500 font-normal"> ({opt.year})</span>}</span>
                        <span className="flex items-center gap-1.5 text-xs text-slate-400 shrink-0 ml-2">
                          {rating != null && <span className="text-orange-500">★ {rating} {ratingSource}</span>}
                          {runtime && <span>· {runtime}</span>}
                        </span>
                      </div>
                      {(opt.director || stars) && (
                        <p className="text-slate-400 text-xs mb-1">
                          {opt.director && <>Dir. {opt.director}</>}{opt.director && stars && <> · </>}{stars}
                        </p>
                      )}
                      {synopsis && <p className="text-slate-400 text-xs mb-1 line-clamp-2">{synopsis}</p>}
                      {opt.why && <p className="text-slate-400 text-xs italic">{opt.why}</p>}
                    </div>
                  );
                })}
              </div>
            )}

            <button
              onClick={spin}
              className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition"
            >
              <Shuffle size={18} />
              {pickOptions.length > 0 ? 'Shuffle again' : (
                <>
                  Pick a{genreFilter !== 'All' ? ` ${genreFilter}` : ''}
                  {activeTab === 'radar' ? " I haven't seen"
                    : activeTab === 'love' ? ' to rewatch'
                    : " Claude thinks I'll like"}
                </>
              )}
            </button>
          </div>
        )}

        {error && (
          <div className="flex items-center justify-between gap-2 mb-3 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
            <p className="text-slate-400 text-xs">
              ✓ Change applied here. Background sync hasn't confirmed yet.
            </p>
            <button
              onClick={retrySave}
              disabled={retrying}
              className="text-xs text-orange-500 hover:text-orange-400 shrink-0 whitespace-nowrap disabled:opacity-50"
            >
              {retrying ? 'Syncing…' : 'Sync now'}
            </button>
          </div>
        )}

        {/* List, grouped by genre — branches by active tab */}
        {activeTab === 'shuffled' ? (
          <div className="space-y-1.5">
            {pickHistory.length === 0 && (
              <p className="text-slate-500 text-sm text-center py-4">Nothing shuffled yet.</p>
            )}
            {pickHistory.map((h, i) => (
              <div
                key={h.title + i}
                onClick={() => showDetailFromHistory(h)}
                className="flex items-center justify-between bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 cursor-pointer hover:border-orange-400/60 transition"
              >
                <span className="text-sm text-slate-300">{h.title}</span>
                <span className="flex items-center gap-2 text-xs text-slate-500 shrink-0 ml-2">
                  {h.rating != null && <span className="text-orange-500">★ {h.rating}</span>}
                  <span>{h.source === 'love' ? 'Love' : h.source === 'random' ? "Claude's Picks" : 'Radar'}</span>
                </span>
              </div>
            ))}
          </div>
        ) : activeTab === 'deleted' ? (
          <div className="space-y-1.5">
            {removed.length === 0 && (
              <p className="text-slate-500 text-sm text-center py-4">Nothing deleted.</p>
            )}
            {removed.map((m, i) => (
              <div key={m.title + i} className="flex items-center justify-between bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
                <div>
                  <span className="text-sm text-slate-400">{m.title}</span>
                  {m.rating != null && <span className="text-orange-500 text-xs ml-2">★ {m.rating}</span>}
                  <p className="text-slate-500 text-xs mt-0.5">
                    from {m.source === 'love' ? 'Love' : m.source === 'random' ? "Claude's Picks" : 'Radar'}
                  </p>
                </div>
                <button
                  onClick={() => restoreMovie(m.title, false)}
                  className="text-xs text-orange-500 hover:text-orange-400 transition shrink-0 ml-2 whitespace-nowrap"
                >
                  Restore
                </button>
              </div>
            ))}
          </div>
        ) : activeTab === 'disliked' ? (
          <div className="space-y-1.5">
            {disliked.length === 0 && (
              <p className="text-slate-500 text-sm text-center py-4">Nothing disliked yet.</p>
            )}
            {disliked.map((m, i) => (
              <div key={m.title + i} className="flex items-center justify-between bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
                <div>
                  <span className="text-sm text-slate-400">{m.title}</span>
                  {m.rating != null && <span className="text-orange-500 text-xs ml-2">★ {m.rating}</span>}
                  {m.genre && <p className="text-slate-500 text-xs mt-0.5">{m.genre}</p>}
                </div>
                <button
                  onClick={() => restoreMovie(m.title, true)}
                  className="text-xs text-orange-500 hover:text-orange-400 transition shrink-0 ml-2 whitespace-nowrap"
                >
                  Undo
                </button>
              </div>
            ))}
          </div>
        ) : activeTab === 'random' ? (
          <div className="space-y-4">
            {list.length === 0 && (
              <p className="text-slate-500 text-sm text-center py-4">Nothing left to suggest in this genre yet.</p>
            )}
            {Object.entries(
              list.reduce((groups, m) => {
                const g = broadGenre(m.genre);
                (groups[g] = groups[g] || []).push(m);
                return groups;
              }, {})
            )
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([genre, rawMovies]) => {
                const movies = sortMode === 'rating'
                  ? [...rawMovies].sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0))
                  : [...rawMovies].sort((a, b) => a.title.localeCompare(b.title));
                return (
                <div key={genre}>
                  <h3 className="text-xs font-semibold text-sky-400 uppercase tracking-wide mb-1.5">
                    {genre} ({movies.length})
                  </h3>
                  <div className="space-y-1.5">
                    {movies.map((m, i) => (
                      <div
                        key={m.title + i}
                        onClick={() => selectMode ? toggleSelected(m.title) : showDetail({ ...m, _tab: 'random', _label: "Claude's Picks" })}
                        className={`border rounded-lg px-3 py-2.5 cursor-pointer transition ${
                          selectedTitles.has(m.title) ? 'bg-blue-950/40 border-blue-500' : 'bg-sky-950/40 border-sky-800/50 hover:border-sky-500/70'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1">
                          <span className="text-sm font-medium flex items-center gap-2 min-w-0">
                            {selectMode && (
                              <span className={`inline-flex items-center justify-center w-4 h-4 rounded border shrink-0 text-[10px] ${
                                selectedTitles.has(m.title) ? 'bg-blue-500 border-blue-400 text-white' : 'border-slate-500'
                              }`}>
                                {selectedTitles.has(m.title) && '✓'}
                              </span>
                            )}
                            <span className="truncate">
                              {m.title}{m.year && <span className="text-slate-500 font-normal"> ({m.year})</span>}
                              {pickActivity.some(a => a.title === m.title && a.action === 'added') && (
                                <span className="text-green-400 text-[10px] font-semibold ml-1.5">✨ NEW</span>
                              )}
                            </span>
                          </span>
                          <span className="flex items-center gap-1.5 text-xs text-slate-400 shrink-0 ml-2">
                            {m.rating != null && <span className="text-orange-500">★ {m.rating}</span>}
                            {(() => { const match = cachedMatch(m); return match && <span className="text-sky-400">🎯 {match.score}</span>; })()}
                            {(() => { const lang = languageName(enriched[m.title]?.originalLanguage); return lang && <span className="text-purple-400">🌐 {lang}</span>; })()}
                            {m.runtime && <span>· {m.runtime}</span>}
                          </span>
                        </div>
                        {(m.director || m.stars) && (
                          <p className="text-slate-400 text-xs mb-1">
                            {m.director && <>Dir. {m.director}</>}{m.director && m.stars && <> · </>}{m.stars}
                          </p>
                        )}
                        {m.synopsis && <p className="text-slate-400 text-xs mb-1">{m.synopsis}</p>}
                        {m.why && <p className="text-slate-400 text-xs mb-2 italic">{m.why}</p>}
                        {!selectMode && (
                          <div className="flex gap-2 items-center flex-wrap">
                            <button
                              onClick={(e) => { e.stopPropagation(); promoteRandom(m.title); }}
                              className="text-xs bg-sky-500/20 text-sky-400 px-2 py-1 rounded hover:bg-sky-500/30 transition"
                            >
                              + Add to Radar
                            </button>
                            <button
                              onClick={(e) => { e.stopPropagation(); promoteRandomToLove(m.title); }}
                              className="text-xs text-orange-500 hover:text-orange-400 transition flex items-center gap-1"
                            >
                              <Heart size={12} /> Move to Love
                            </button>
                            <button
                              onClick={(e) => { e.stopPropagation(); dislikeMovie(randomPicks, setRandomPicks, m.title); }}
                              className="text-xs text-slate-400 hover:text-red-400 transition"
                            >
                              👎 Dislike
                            </button>
                            <button
                              onClick={(e) => { e.stopPropagation(); removeMovie(randomPicks, setRandomPicks, null, m.title); }}
                              className="text-xs text-slate-400 hover:text-slate-300 transition"
                            >
                              Remove
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
                );
              })}
          </div>
        ) : activeTab === 'stats' ? (
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-2">
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center">
                <p className="text-2xl font-bold text-orange-500">{love.length}</p>
                <p className="text-[11px] text-slate-400 mt-0.5">Loved</p>
              </div>
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center">
                <p className="text-2xl font-bold text-blue-400">{radar.length}</p>
                <p className="text-[11px] text-slate-400 mt-0.5">On Radar</p>
              </div>
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center">
                <p className="text-2xl font-bold text-sky-400">{Math.round(statsData.totalMinutes / 60)}</p>
                <p className="text-[11px] text-slate-400 mt-0.5">Hours loved</p>
              </div>
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center">
                <p className="text-2xl font-bold text-slate-300">{statsData.totalShuffles}</p>
                <p className="text-[11px] text-slate-400 mt-0.5">Shuffles</p>
              </div>
            </div>

            {statsData.topGenres.length > 0 && (
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-4">
                <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Genres you love</h3>
                <div className="space-y-1.5">
                  {statsData.topGenres.map(([g, n]) => (
                    <div key={g} className="flex items-center gap-2">
                      <span className="text-xs text-slate-300 w-24 shrink-0 truncate">{g}</span>
                      <div className="flex-1 h-2 bg-slate-900 rounded-full overflow-hidden">
                        <div className="h-full bg-orange-500 rounded-full" style={{ width: `${Math.round((n / statsData.topGenres[0][1]) * 100)}%` }} />
                      </div>
                      <span className="text-xs text-slate-500 w-5 text-right shrink-0">{n}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {statsData.topDecades.length > 0 && (
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-4">
                <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Decades you love</h3>
                <div className="space-y-1.5">
                  {(() => {
                    const max = Math.max(...statsData.topDecades.map(x => x[1]));
                    return statsData.topDecades.map(([d, n]) => (
                      <div key={d} className="flex items-center gap-2">
                        <span className="text-xs text-slate-300 w-14 shrink-0">{d}</span>
                        <div className="flex-1 h-2 bg-slate-900 rounded-full overflow-hidden">
                          <div className="h-full bg-blue-500 rounded-full" style={{ width: `${Math.round((n / max) * 100)}%` }} />
                        </div>
                        <span className="text-xs text-slate-500 w-5 text-right shrink-0">{n}</span>
                      </div>
                    ));
                  })()}
                </div>
              </div>
            )}
