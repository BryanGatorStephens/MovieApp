            {(statsData.topDirectors.length > 0 || statsData.topActors.length > 0) && (
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 grid grid-cols-2 gap-3">
                {statsData.topDirectors.length > 0 && (
                  <div>
                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Top directors</h3>
                    <ul className="text-xs text-slate-300 space-y-1">
                      {statsData.topDirectors.map(([d, n]) => <li key={d}>{d} <span className="text-slate-500">×{n}</span></li>)}
                    </ul>
                  </div>
                )}
                {statsData.topActors.length > 0 && (
                  <div>
                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">Top actors</h3>
                    <ul className="text-xs text-slate-300 space-y-1">
                      {statsData.topActors.map(([a, n]) => <li key={a}>{a} <span className="text-slate-500">×{n}</span></li>)}
                    </ul>
                  </div>
                )}
              </div>
            )}

            <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-1.5 text-xs text-slate-400">
              {statsData.avgLoveRating != null && <p>Average rating of what you love: <span className="text-orange-500 font-medium">★ {statsData.avgLoveRating.toFixed(1)}</span></p>}
              {statsData.avgDislikedRating != null && <p>Average rating of what you've disliked: <span className="text-slate-300 font-medium">★ {statsData.avgDislikedRating.toFixed(1)}</span></p>}
              {statsData.longest && <p>Longest movie you love: <span className="text-slate-300">{statsData.longest.title}</span> ({Math.floor(statsData.longest.mins / 60)}h {statsData.longest.mins % 60}m)</p>}
              {statsData.shortest && statsData.shortest.title !== statsData.longest?.title && <p>Shortest: <span className="text-slate-300">{statsData.shortest.title}</span> ({statsData.shortest.mins} min)</p>}
              {statsData.oldestYear && statsData.newestYear && <p>Spans {statsData.oldestYear}–{statsData.newestYear}</p>}
              {statsData.franchiseCount > 0 && <p>{statsData.franchiseCount} of your loved movies are part of a franchise/series.</p>}
              {statsData.foreignCount > 0 && <p>{statsData.foreignCount} loved movie{statsData.foreignCount === 1 ? " isn't" : "s aren't"} in English.</p>}
              {statsData.radarKnownCount > 0 && <p>{statsData.radarFreeCount} of {statsData.radarKnownCount} checked Radar titles are free on your subscriptions right now.</p>}
              {removed.length + disliked.length > 0 && <p>{removed.length} deleted, {disliked.length} disliked along the way.</p>}
            </div>
          </div>
        ) : (
          <div className="space-y-4">
            {list.length === 0 && (
              <p className="text-slate-500 text-sm text-center py-4">Nothing here yet.</p>
            )}
            {Object.entries(
              list.reduce((groups, m) => {
                const g = broadGenre(m.genre);
                (groups[g] = groups[g] || []).push(m);
                return groups;
              }, {})
            )
              .sort((a, b) => a[0].localeCompare(b[0]))
              .map(([genre, rawMovies]) => {
                const movies = sortMode === 'rating'
                  ? [...rawMovies].sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0))
                  : [...rawMovies].sort((a, b) => a.title.localeCompare(b.title));
                return (
                <div key={genre}>
                  <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1.5">
                    {genre} ({movies.length})
                  </h3>
                  <div className="space-y-1.5">
                    {movies.map((m, i) => (
                      activeTab === 'radar' ? (
                        <div
                          key={m.title + i}
                          onClick={() => selectMode ? toggleSelected(m.title) : showDetail({ ...m, _tab: 'radar', _label: 'Radar' })}
                          className={`border rounded-lg px-3 py-2.5 cursor-pointer transition ${
                            selectedTitles.has(m.title) ? 'bg-blue-950/40 border-blue-500' : 'bg-slate-800 border-slate-700 hover:border-orange-400/60'
                          }`}
                        >
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-sm font-medium flex items-center gap-2 min-w-0">
                              {selectMode && (
                                <span className={`inline-flex items-center justify-center w-4 h-4 rounded border shrink-0 text-[10px] ${
                                  selectedTitles.has(m.title) ? 'bg-blue-500 border-blue-400 text-white' : 'border-slate-500'
                                }`}>
                                  {selectedTitles.has(m.title) && '✓'}
                                </span>
                              )}
                              <span className="truncate">{m.title}{m.year && <span className="text-slate-500 font-normal"> ({m.year})</span>}</span>
                            </span>
                            <span className="flex items-center gap-1.5 text-xs text-slate-400 shrink-0 ml-2">
                              {m.rating != null && <span className="text-orange-500">★ {m.rating}</span>}
                              {(() => { const match = cachedMatch(m); return match && <span className="text-sky-400">🎯 {match.score}</span>; })()}
                              {(() => { const lang = languageName(enriched[m.title]?.originalLanguage); return lang && <span className="text-purple-400">🌐 {lang}</span>; })()}
                              {m.runtime && <span>· {m.runtime}</span>}
                            </span>
                          </div>
                          {(m.director || m.stars) && (
                            <p className="text-slate-400 text-xs mb-1">
                              {m.director && <>Dir. {m.director}</>}{m.director && m.stars && <> · </>}{m.stars}
                            </p>
                          )}
                          {m.synopsis && <p className="text-slate-400 text-xs mb-1">{m.synopsis}</p>}
                          {m.why && <p className="text-slate-500 text-xs mb-2 italic">{m.why}</p>}
                          {!selectMode && (
                            <div className="flex gap-3 items-center flex-wrap">
                              <button
                                onClick={(e) => { e.stopPropagation(); promoteToLove(m.title); }}
                                className="text-xs text-orange-500 hover:text-orange-400 transition flex items-center gap-1"
                              >
                                <Heart size={12} /> Move to Love
                              </button>
                              <button
                                onClick={(e) => { e.stopPropagation(); dislikeMovie(radar, setRadar, m.title); }}
                                className="text-xs text-slate-500 hover:text-red-400 transition"
                              >
                                👎 Dislike
                              </button>
                              <button
                                onClick={(e) => { e.stopPropagation(); removeMovie(radar, setRadar, 'movies:radar', m.title); }}
                                className="text-xs text-slate-500 hover:text-slate-400 transition"
                              >
                                Remove
                              </button>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div
                          key={m.title + i}
                          onClick={() => selectMode ? toggleSelected(m.title) : showDetail({ ...m, _tab: 'love', _label: 'Love' })}
                          className={`flex items-center justify-between border rounded-lg px-3 py-2 cursor-pointer transition ${
                            selectedTitles.has(m.title) ? 'bg-blue-950/40 border-blue-500' : 'bg-slate-800 border-slate-700 hover:border-orange-400/60'
                          }`}
                        >
                          <div className="flex items-center gap-2 min-w-0">
                            {selectMode && (
                              <span className={`inline-flex items-center justify-center w-4 h-4 rounded border shrink-0 text-[10px] ${
                                selectedTitles.has(m.title) ? 'bg-blue-500 border-blue-400 text-white' : 'border-slate-500'
                              }`}>
                                {selectedTitles.has(m.title) && '✓'}
                              </span>
                            )}
                            <div className="min-w-0">
                              <span className="text-sm">{m.title}{m.year && <span className="text-slate-500"> ({m.year})</span>}</span>
                              {m.rating != null && (
                                <span className="text-orange-500 text-xs ml-2">★ {m.rating}</span>
                              )}
                              {(() => { const lang = languageName(enriched[m.title]?.originalLanguage); return lang && <span className="text-purple-400 text-xs ml-2">🌐 {lang}</span>; })()}
                            </div>
                          </div>
                          {!selectMode && (
                            <div className="flex items-center gap-2 shrink-0 ml-2">
                              <button
                                onClick={(e) => { e.stopPropagation(); toggleWatchedTogether(m.title); }}
                                title="Watched together?"
                                className={`transition ${m.watchedTogether ? 'text-orange-500' : 'text-slate-600 hover:text-slate-400'}`}
                              >
                                <Users size={15} />
                              </button>
                              <button
                                onClick={(e) => { e.stopPropagation(); removeMovie(love, setLove, 'movies:love', m.title); }}
                                className="text-slate-500 hover:text-red-400 transition"
                              >
                                <X size={15} />
                              </button>
                            </div>
                          )}
                        </div>
                      )
                    ))}
                  </div>
                </div>
                );
              })}
          </div>
        )}

        {/* Settings — Export / Import / Debug consolidated into one panel */}
        <div className="mt-8 pt-4 border-t border-slate-700">
          <button
            onClick={() => setShowSettings(!showSettings)}
            className="text-xs text-slate-400 hover:text-slate-300 transition"
          >
            {showSettings ? '▾' : '▸'} ⚙️ Settings
          </button>

          {showSettings && (
            <div className="mt-2 bg-slate-800 border border-slate-700 rounded-lg p-3">
              <div className="mb-3 pb-3 border-b border-slate-700">
                <p className="text-xs text-slate-400 mb-2">
                  {hasCustomKey
                    ? 'Using your own TMDB key for search, posters, and fresh picks.'
                    : "Search, posters, and fresh picks (🎲 Claude's Picks) are working off a shared default key. Optional: paste your own free key (themoviedb.org/settings/api — the \"API Key (v3 auth)\" value) if you'd rather not share the default's rate limit."}
                </p>
                <input
                  value={tmdbKeyInput}
                  onChange={e => setTmdbKeyInput(e.target.value)}
                  placeholder={hasCustomKey ? 'Paste your TMDB API key...' : 'Paste your own TMDB API key (optional)...'}
                  className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs font-mono text-slate-300 placeholder-slate-400 focus:outline-none focus:border-blue-500 mb-2"
                />
                <button
                  onClick={() => saveTmdbKey(tmdbKeyInput)}
                  className="text-xs font-medium bg-sky-500 hover:bg-sky-400 text-white px-3 py-1.5 rounded transition"
                >
                  Save key
                </button>
                {hasCustomKey
                  ? <span className="text-xs text-emerald-400 ml-2">✓ Using your own key</span>
                  : <span className="text-xs text-slate-500 ml-2">Using shared default</span>}
              </div>
              <div className="mb-3 pb-3 border-b border-slate-700">
                <p className="text-xs text-slate-400 mb-2">
                  Pre-fetch posters, full synopsis, cast, and similar-movie suggestions (via TMDB) for every movie in your library, so they're ready instantly when you tap in. New movies you add also fetch automatically going forward.
                  <span className="block mt-1 text-slate-500">Requires the TMDB key above.</span>
                </p>
                <button
                  onClick={preloadAllDetails}
                  disabled={!!preloadStatus}
                  className="text-xs font-medium bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-400 text-white px-3 py-1.5 rounded transition"
                >
                  {preloadStatus ? `Loading ${preloadStatus.done}/${preloadStatus.total}…` : '✨ Preload all details'}
                </button>
              </div>
              <div className="flex gap-2 mb-3">
                {['export', 'import', 'history', 'debug'].map(s => (
                  <button
                    key={s}
                    onClick={() => { setSettingsTab(s); setImportMsg(''); }}
                    className={`text-xs font-medium px-2.5 py-1 rounded-full transition capitalize ${
                      settingsTab === s ? 'bg-slate-100 text-slate-100' : 'bg-slate-700 text-slate-300'
                    }`}
                  >
                    {s}
                  </button>
                ))}
              </div>

              {settingsTab === 'export' && (
                <div>
                  <p className="text-xs text-slate-400 mb-2">
                    Copy everything below and paste it somewhere safe (a note, a doc). If the app ever resets, paste it back in via Import to restore instantly.
                  </p>
                  <textarea
                    readOnly
                    value={exportData()}
                    onClick={e => e.target.select()}
                    className="w-full h-40 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs font-mono text-slate-400 focus:outline-none focus:border-blue-500"
                  />
                  <p className="text-xs text-slate-500 mt-1">Tap the box, select all, copy.</p>
                </div>
              )}

              {settingsTab === 'import' && (
                <div>
                  <p className="text-xs text-slate-400 mb-2">
                    Paste a previously exported library below. This replaces everything currently shown in the app.
                  </p>
                  <textarea
                    value={importText}
                    onChange={e => setImportText(e.target.value)}
                    placeholder="Paste exported JSON here..."
                    className="w-full h-32 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs font-mono text-slate-400 placeholder-slate-400 focus:outline-none focus:border-blue-500"
                  />
                  <button
                    onClick={importData}
                    className="mt-2 text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded transition"
                  >
                    Import
                  </button>
                  {importMsg && <p className="text-xs text-slate-400 mt-2">{importMsg}</p>}
                </div>
              )}

              {settingsTab === 'history' && (
                <div>
                  <p className="text-xs text-slate-400 mb-2">
                    Logged automatically whenever a movie moves into Love. Older Love entries added before this feature won't have a date.
                  </p>
                  {(() => {
                    const now = new Date();
                    const ym = now.toISOString().slice(0, 7);
                    const y = now.toISOString().slice(0, 4);
                    const dated = love.filter(m => m.watchedDate);
                    const stats = [
                      { label: 'Total watched', value: love.length },
                      { label: 'This month', value: dated.filter(m => m.watchedDate.startsWith(ym)).length },
                      { label: 'This year', value: dated.filter(m => m.watchedDate.startsWith(y)).length },
                      { label: 'Together', value: love.filter(m => m.watchedTogether).length },
                    ];
                    return (
                      <div className="grid grid-cols-4 gap-1.5 mb-3">
                        {stats.map(s => (
                          <div key={s.label} className="bg-slate-900 border border-slate-700 rounded px-1.5 py-1.5 text-center">
                            <div className="text-sm font-semibold text-orange-500">{s.value}</div>
                            <div className="text-[9px] text-slate-500 leading-tight">{s.label}</div>
                          </div>
                        ))}
                      </div>
                    );
                  })()}
                  <div className="max-h-64 overflow-y-auto space-y-1">
                    {love.filter(m => m.watchedDate).length === 0 && (
                      <p className="text-xs text-slate-500">No dated entries yet — watch something!</p>
                    )}
                    {love
                      .filter(m => m.watchedDate)
                      .sort((a, b) => (b.watchedDate || '').localeCompare(a.watchedDate || ''))
                      .map(m => (
                        <div key={m.title} className="flex items-center justify-between text-xs bg-slate-900 border border-slate-700 rounded px-2 py-1.5">
                          <span className="text-slate-300">{m.title}</span>
                          <span className="text-slate-500 shrink-0 ml-2">{m.watchedDate}</span>
                        </div>
                      ))}
                  </div>
                </div>
              )}

              {settingsTab === 'debug' && debugSnapshot && (
                <div className="text-xs text-slate-400 space-y-2">
                  <p>Loaded at: {debugSnapshot.loadedAt}</p>
                  <p>Found saved data in storage: {debugSnapshot.rawFound ? 'yes' : 'no (fresh/empty)'}</p>
                  <input
                    value={debugSearch}
                    onChange={e => setDebugSearch(e.target.value)}
                    placeholder="Type a movie title to check..."
                    className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs placeholder-slate-400 focus:outline-none focus:border-blue-500"
                  />
                  {debugSearch.trim() && (
                    <div className="space-y-1 font-mono">
                      <p>As loaded from storage (raw, before any merge):</p>
                      <p>&nbsp;&nbsp;Love: {debugSnapshot.rawLove.some(t => t.toLowerCase().includes(debugSearch.toLowerCase())) ? '✓ present' : '✗ not found'}</p>
                      <p>&nbsp;&nbsp;Radar: {debugSnapshot.rawRadar.some(t => t.toLowerCase().includes(debugSearch.toLowerCase())) ? '✓ present' : '✗ not found'}</p>
                      <p>After merge (what you actually see):</p>
                      <p>&nbsp;&nbsp;Love: {love.some(t => t.title.toLowerCase().includes(debugSearch.toLowerCase())) ? '✓ present' : '✗ not found'}</p>
                      <p>&nbsp;&nbsp;Radar: {radar.some(t => t.title.toLowerCase().includes(debugSearch.toLowerCase())) ? '✓ present' : '✗ not found'}</p>
                    </div>
                  )}
                  <details>
                    <summary className="cursor-pointer text-slate-500">Raw storage value (first 300 chars)</summary>
                    <p className="font-mono break-all mt-1 text-slate-500">{debugSnapshot.rawValueSnippet || '(none)'}</p>
                  </details>
                </div>
              )}
            </div>
          )}
        </div>
        </>
        )}
      </div>

      {/* Custom confirmation modal — native window.confirm is blocked in this sandbox */}
      {confirmAction && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-50">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-xs w-full">
            <p className="text-sm text-slate-100 mb-4">{confirmAction.message}</p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmAction(null)}
                className="flex-1 text-sm font-medium text-slate-300 bg-slate-700 hover:bg-slate-600 rounded-lg py-2 transition"
              >
                Cancel
              </button>
              <button
                onClick={() => {
                  confirmAction.onConfirm();
                  setConfirmAction(null);
                }}
                className="flex-1 text-sm font-medium text-white bg-red-500 hover:bg-red-400 rounded-lg py-2 transition"
              >
                Remove
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Back to top — only once you've actually scrolled a few screens
          down, sitting just above the persistent bottom bar so it never
          overlaps it. */}
      {showBackToTop && (
        <button
          onClick={scrollToTop}
          aria-label="Back to top"
          className="fixed bottom-20 right-4 z-40 w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 shadow-lg flex items-center justify-center transition"
        >
          ↑
        </button>
      )}

      {/* Persistent reminder — always visible, one tap to copy your progress.
          There's no reliable way to detect "closing" in this sandbox, so this
          stays on screen the whole time instead of trying to interrupt you. */}
      <div className="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 px-4 py-3 z-40">
        <div className="max-w-md mx-auto flex items-center justify-between gap-3">
          <p className="text-xs text-slate-400">
            {copyStatus || 'Closing soon? Copy your progress first.'}
          </p>
          <button
            onClick={copyToClipboard}
            className="text-xs font-medium bg-orange-500 hover:bg-orange-400 text-white px-3 py-1.5 rounded-lg transition shrink-0 whitespace-nowrap"
          >
            📋 Copy progress
          </button>
        </div>
      </div>
    </div>

  );
}

// Catches any error thrown during render anywhere in MoviePicker and shows a
// recoverable screen instead of letting React silently unmount everything
// (which is what happens by default with no boundary — no back button, no
// error message, nothing — forcing a force-quit and reopen to escape).
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('MoviePicker crashed:', error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: '100vh', background: '#0f172a', color: '#f87171', padding: '2rem', fontFamily: 'sans-serif' }}>
          <p style={{ fontWeight: 600, marginBottom: '0.75rem' }}>Something went wrong.</p>
          <p style={{ fontSize: '0.8rem', color: '#94a3b8', whiteSpace: 'pre-wrap', marginBottom: '1.5rem' }}>
            {String(this.state.error && this.state.error.message || this.state.error)}
          </p>
          <button
            onClick={() => this.setState({ error: null })}
            style={{ background: '#334155', color: '#e2e8f0', border: 'none', borderRadius: '0.5rem', padding: '0.6rem 1rem', fontSize: '0.85rem', marginRight: '0.5rem' }}
          >
            Try to continue
          </button>
          <button
            onClick={() => window.location.reload()}
            style={{ background: '#2563eb', color: 'white', border: 'none', borderRadius: '0.5rem', padding: '0.6rem 1rem', fontSize: '0.85rem' }}
          >
            Reload app
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

const rootEl = document.getElementById('root');
ReactDOM.createRoot(rootEl).render(
  <ErrorBoundary>
    <MoviePicker />
  </ErrorBoundary>
);
</script>
</body>
</html>
